# =============================================================================
# TODO Tracker Workflow
# =============================================================================
# Scans codebase for TODO/FIXME comments and creates GitHub issues.
# Runs weekly and on-demand to ensure no TODOs are forgotten.
#
# Creates issues with:
# - File location and line number
# - TODO context (surrounding code)
# - Labels: type: chore, status: needs-triage
# =============================================================================

name: TODO Tracker

on:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/*.ts'
      - '**/*.tsx'

permissions:
  contents: read
  issues: write

jobs:
  scan-todos:
    name: Scan for TODOs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for TODO comments
        id: todos
        run: |
          TODOS_FILE=$(mktemp)
          ./scripts/scan-todos.sh > "$TODOS_FILE"
          TODO_COUNT=$(wc -l < "$TODOS_FILE" | tr -d ' ')

          echo "Found $TODO_COUNT TODO items"
          echo "count=$TODO_COUNT" >> "$GITHUB_OUTPUT"
          echo "todos_file=$TODOS_FILE" >> "$GITHUB_OUTPUT"

          if [ "$TODO_COUNT" -gt 0 ]; then
            {
              echo "### TODO Items Found: $TODO_COUNT"
              echo ""
              echo "| File | Line | Comment |"
              echo "|------|------|---------|"
            } >> "$GITHUB_STEP_SUMMARY"
            head -50 "$TODOS_FILE" | while IFS=: read -r file line content; do
              safe_content=$(echo "$content" | sed 's/|/\\|/g' | head -c 100)
              echo "| $file | $line | $safe_content |" >> "$GITHUB_STEP_SUMMARY"
            done
            if [ "$TODO_COUNT" -gt 50 ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "_...and $((TODO_COUNT - 50)) more_" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### No TODO items found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for new TODOs
        if: github.event_name == 'push'
        run: |
          echo "Checking for new TODOs in this commit..."

          # Get changed files
          git diff --name-only HEAD~1 HEAD 2>/dev/null | while read -r file; do
            if [[ "$file" =~ \.(go|ts|tsx|js|jsx)$ ]]; then
              # Check for TODOs in changed lines
              git diff HEAD~1 HEAD -- "$file" | grep "^+" | grep -i "TODO\|FIXME" && \
                echo "::warning file=$file::New TODO found in $file"
            fi
          done || true

      - name: Create summary issue (weekly)
        if: github.event_name == 'schedule' && steps.todos.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TODO_COUNT: ${{ steps.todos.outputs.count }}
          TODOS_FILE: ${{ steps.todos.outputs.todos_file }}
        run: |
          WEEK=$(date +%Y-W%V)
          EXISTING=$(gh issue list --label "type: chore" --search "TODO Summary $WEEK" --json number --jq '.[0].number' || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Summary issue #$EXISTING already exists for this week"
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "## Weekly TODO Summary" \
            "" \
            "**Week:** $WEEK" \
            "**Total TODOs:** $TODO_COUNT" \
            "" \
            "### Action Required" \
            "Please review and either:" \
            "1. Create specific issues for important TODOs" \
            "2. Fix the TODO and remove the comment" \
            "3. Add context if the TODO is intentional" \
            "" \
            "### TODO Locations" \
            '```' \
            "$(head -100 "$TODOS_FILE")" \
            '```' \
            "" \
            "---" \
            "_This issue was automatically created by the TODO Tracker workflow._")

          # `gh issue create` has no --json; it prints the new issue URL.
          NEW=$(gh issue create \
            --title "TODO Summary $WEEK: $TODO_COUNT items" \
            --body "$BODY" \
            --label "type: chore,status: needs-triage")
          NEW=${NEW##*/}

          # Supersede prior weeks. Each summary is a snapshot of the same scan,
          # so leaving them open piles up duplicates — four of them (#554,
          # #650, #747, #926) had accumulated by 2026-W36.
          gh issue list --label "type: chore" --state open --limit 100 \
            --json number,title \
            --jq '.[] | select(.title | startswith("TODO Summary")) | .number' |
            while read -r old; do
              if [ "$old" != "$NEW" ]; then
                gh issue close "$old" --reason "not planned" \
                  --comment "Superseded by #$NEW (TODO Summary $WEEK)."
              fi
            done
