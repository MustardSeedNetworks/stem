# =============================================================================
# Release (goreleaser)
# =============================================================================
# Canonical release pipeline. Replaces the prior hand-coded matrix workflow
# (release-linux / release-macos / release-windows / publish) plus the
# standalone .nfpm.yaml. Drives .goreleaser.yml inside the goreleaser-cross
# container.
#
# Publishing is reserved for pushed tags. Only a push can satisfy the
# verify-tag assertion that the commit has a successful "CI Complete" check -
# a dispatch has no pushed tag to check, and a v* tag can be created on any
# commit, so a dispatched publish would ship an unvalidated build. Every
# publishing step therefore carries `github.event_name == 'push'` in addition
# to `!inputs.dry_run`, and verify-tag refuses a dispatch that asks to publish
# rather than silently downgrading it to a snapshot.
#
# Triggers:
#   - push to a v* tag: real release - builds, signs, publishes
#   - workflow_dispatch: snapshot only, whatever dry_run says - no publish, no
#     signing; artifacts uploaded for inspection. dry_run=false is rejected.
#
# Mirrors seed and niac's release.yml shape so all three projects converge
# on the same release tooling.
#
# Toolchain notes:
#   Linux amd64 DEB/RPM packages include the native C reflector dataplane.
#   Tarballs, Linux arm64, Darwin, and Windows use the portable Go build.
#
# Inputs: only the typed `dry_run` boolean - no untrusted event fields
# are interpolated into shell commands.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Must stay true: a manual run is always snapshot-only. Publishing requires pushing a v* tag."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A v* tag is enough to start a release: no ruleset restricts tag creation in
  # any fleet repo (verified 2026-08-27 — the only ruleset present is
  # merge-queue, and it targets branches). Until tag protection lands, this is
  # the gate. It refuses to build a tag whose commit never passed CI, so an
  # accidental or unauthorised tag fails here instead of producing signed,
  # published artifacts.
  #
  # The assertion is skipped for workflow_dispatch, which is the deliberate
  # dry-run path and carries no tag — but the job itself still runs and
  # succeeds, so nothing downstream is skipped.
  verify-tag:
    name: Verify tagged commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      # The condition is on the step, not the job. A job-level `if:` that
      # evaluated false would leave this SKIPPED, and a skipped `needs:` entry
      # skips everything downstream through the implicit success() — the whole
      # dry-run path would silently do nothing. As a step, the job still
      # reports success and dependents run normally.
      # A manual dispatch has no pushed tag whose commit can be checked, and a
      # v* tag can be created on any commit, so a dispatched publish would ship
      # an unvalidated build. Publishing is restricted to push events below;
      # refuse here as well so an operator who asks for one is told, rather than
      # getting a snapshot they may mistake for a release.
      - name: Refuse a manual dispatch that asks to publish
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::A $EVENT run cannot publish: only a pushed v* tag whose commit passed 'CI Complete' may. Re-run with dry_run=true for a snapshot, or push the tag."
          exit 1

      - name: Assert CI Complete succeeded for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # index() returns 0 for a first-element match, and jq's // only fires
          # on null/false — so a match at position 0 still prints 0 and passes.
          found=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI Complete") | .conclusion] | index("success") // empty')
          if [ -z "$found" ]; then
            echo "::error::No successful 'CI Complete' check run for ${GITHUB_SHA}. Refusing to release an unvalidated commit."
            exit 1
          fi
          echo "CI Complete succeeded for ${GITHUB_SHA}"

  # =========================================================================
  # UI build - done outside the goreleaser-cross container because that
  # image is Go-focused and doesn't ship Node. Vite writes directly to
  # internal/api/ui/; the next job inherits the workspace.
  # =========================================================================
  build-ui:
    name: Build UI
    needs: [verify-tag]
    runs-on: ubuntu-latest
    outputs:
      ui_hash: ${{ steps.ui-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        # The Node/npm pin lives in the composite action, same as ci.yml, so
        # the release path cannot drift from what CI tested against.
        uses: ./.github/actions/setup-node
        with:
          # No npm cache on the release path. This job's output is published
          # and attested, so a poisoned cache entry restored from a branch
          # would land in a signed artifact. CI keeps its cache; releases
          # always resolve from the registry.
          cache: ""

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Compute UI build hash
        id: ui-hash
        run: |
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          echo "hash=$UI_BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: internal/api/ui/
          retention-days: 1
          include-hidden-files: true

  # =========================================================================
  # goreleaser build + (when not dry-run) publish.
  # =========================================================================
  goreleaser:
    name: goreleaser ${{ (github.event_name == 'push' && !inputs.dry_run) && '(release)' || '(snapshot)' }}
    runs-on: ubuntu-latest
    needs: [build-ui]
    permissions:
      contents: write
      id-token: write # cosign keyless OIDC
    container:
      # Docker Hub tag scheme: <go-version>-<goreleaser-version>. v1.26.5
      # tracks Go 1.26.5 + goreleaser v2.17.1. Pinned for reproducibility;
      # bump when newer revs land. Keep fresh so the image's baked libs
      # don't drift from upstream (seed#1577).
      image: goreleaser/goreleaser-cross:v1.27.0@sha256:3ce3506ee9179c4122ba0b5dc13ab564ff259fb65f45bfad005ddd5e4a3d326d
    outputs:
      # base64-encoded SHA-256 hashes of all release artifacts, formatted
      # for slsa-github-generator's base64-subjects input. Set only on a
      # real (non-snapshot) release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Mark workspace as safe (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Install native reflector build dependencies
        # Container runs as root (no sudo) — see the "Mark workspace as safe"
        # step above for the same reason.
        #
        # A stalled Ubuntu mirror once hung apt for 25 minutes installing a
        # single package elsewhere in the fleet (niac job 95072124340),
        # because apt waits forever on a dead connection by default. Bound
        # apt's own network waits, then retry the transient case. This step
        # gates the release build, so a hang here is worse than in CI.
        #
        # clang-18 and make ship in the goreleaser-cross-toolchains base
        # image (ubuntu:noble, installs the `clang`/build-essential
        # metapackages) — only the packages not already in the image are
        # installed here.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@a146506fd53fe5e01fdc01892dd838c10081d183 # v1.9.0
        with:
          packages: libbpf-dev libelf-dev libxdp-dev zlib1g-dev
          no-install-recommends: 'true'

      - name: Install Syft (SBOM) inside container
        env:
          # Pinned version + checksum (from syft's published checksums.txt),
          # matching the gitleaks-CLI pattern in ci.yml's security job —
          # `curl ... install.sh | sh` from the mutable `main` branch is a
          # supply-chain risk (a compromised main would run arbitrary code
          # in the release container). Rotate together on upgrade.
          SYFT_VERSION: "1.46.0"
          SYFT_SHA256: "d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca"
        # Container run steps default to `sh` (dash), which rejects
        # `set -o pipefail`; force bash (present in goreleaser-cross).
        shell: bash
        run: |
          set -euo pipefail
          # Downloaded into a temp dir rather than the workspace, matching the
          # Cosign step below and seed's equivalent. *.tar.gz is gitignored, so
          # this was not what goreleaser validation was being skipped for -- it
          # is hygiene, not the fix.
          syft_dir=$(mktemp -d)
          trap 'rm -rf "$syft_dir"' EXIT
          curl -sSfL -o "$syft_dir/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $syft_dir/syft.tar.gz" | sha256sum -c -
          tar -xzf "$syft_dir/syft.tar.gz" -C /usr/local/bin syft
          chmod +x /usr/local/bin/syft

      # Downloaded and executed in a job holding contents: write and
      # id-token: write, so an unverified binary here signs the release. Syft
      # two steps above was already checksummed; cosign was the outlier.
      # Checksum from the upstream cosign_checksums.txt for v3.1.3, verified
      # against sigstore's published file. Rotate both together on upgrade.
      - name: Install Cosign inside container
        shell: bash
        env:
          COSIGN_VERSION: "v3.1.3"
          COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
        run: |
          set -euo pipefail
          cosign_dir=$(mktemp -d)
          trap 'rm -rf "$cosign_dir"' EXIT
          curl -sSfL -o "$cosign_dir/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $cosign_dir/cosign-linux-amd64" | sha256sum -c -
          install -m 0755 "$cosign_dir/cosign-linux-amd64" /usr/local/bin/cosign

      # Anything that is not a pushed, non-dry-run tag is a snapshot. See the
      # publish predicate below: the two conditions are exact complements, so
      # exactly one of these steps runs on every path through this job.
      # goreleaser validates that it is building from a clean tree at the
      # expected tag. Asserting it here first means a step that drops a file in
      # the workspace fails with a message naming the file, rather than as a
      # goreleaser error whose easiest fix is to skip validation again -- which
      # is how --skip=validate came to sit on the publish path.
      - name: Assert the workspace is clean before goreleaser
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the workspace is dirty before goreleaser; a build step left files behind:"
            git status --porcelain
            exit 1
          fi
          echo "workspace clean"

      - name: Run goreleaser (snapshot/dry-run)
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --snapshot --clean --skip=publish,announce

      # The publish predicate. `github.event_name == 'push'` is what ties a
      # release to the verify-tag assertion above, which only a push can satisfy.
      - name: Run goreleaser (publish)
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Validation is on: it is what checks the build is running from a clean
        # tree at the expected tag, on the path that produces signed, attested,
        # published artifacts. The comment that used to sit here blamed the UI
        # artifact, but internal/api/ui/* is gitignored and only .gitkeep is
        # tracked, so that cannot dirty the tree. No other source is known --
        # which is why the step above asserts it rather than assuming it.
        run: goreleaser release --clean

      - name: Capture artifact hashes for SLSA provenance
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        id: hashes
        shell: bash
        run: |
          # goreleaser drops artifacts.json describing every produced
          # artifact. Filter to the user-facing ones (archive/package
          # types) and base64-encode their SHA-256 list for the
          # slsa-github-generator reusable workflow.
          set -euo pipefail
          hashes=$(jq -r '
            map(select(.type == "Archive" or .type == "Linux Package")) |
            map("\(.extra.Checksum | sub("^sha256:"; ""))  \(.name)") |
            join("\n")
          ' dist/artifacts.json | base64 -w0)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Upload dry-run artifact bundle for inspection
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

  # =========================================================================
  # SLSA L3 provenance — runs on real releases (not dry-run).
  #
  # Uses GitHub's first-party `actions/attest-build-provenance` rather than
  # the slsa-github-generator reusable workflow. The latter (v2.1.0, the
  # current latest as of 2026-05) has a known bug in its upload-assets
  # step where UNTRUSTED_PATH is passed empty, causing the secure-download
  # action to exit 1 and the `final` job to exit 27. attest-build-provenance
  # produces the same SLSA L3 in-toto attestation (signed via Sigstore
  # keyless OIDC), surfaces it on the release's GitHub Attestations panel,
  # AND attaches the bundle file to the release as a downloadable asset.
  # Mirrors seed and niac's provenance job.
  #
  # =========================================================================
  provenance:
    name: SLSA provenance
    # Only a real release attests: a snapshot has nothing published to attest
    # against. `!cancelled()` is kept so a cancelled upstream is distinguishable
    # from a failed one.
    if: ${{ !cancelled() && github.event_name == 'push' && !inputs.dry_run && needs.goreleaser.result == 'success' }}
    needs: [goreleaser]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Sigstore OIDC signing
      contents: write       # uploading the bundle to the release
      attestations: write   # GitHub Attestations API
    steps:
      - name: Decode artifact subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          # Pick whichever upstream ran. The unused one is empty.
          echo "${{ needs.goreleaser.outputs.hashes }}" \
            | base64 -d > subjects.txt
          echo "Subjects:"
          cat subjects.txt

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects.txt

      - name: Attach attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
             stem-slsa-provenance.intoto.jsonl
          gh release upload "$TARGET_TAG" \
             stem-slsa-provenance.intoto.jsonl --clobber --repo "${GITHUB_REPOSITORY}"
