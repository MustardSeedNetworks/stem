# =============================================================================
# Release (goreleaser)
# =============================================================================
# Canonical release pipeline. Replaces the prior hand-coded matrix workflow
# (release-linux / release-macos / release-windows / publish) plus the
# standalone .nfpm.yaml. Drives .goreleaser.yml inside the goreleaser-cross
# container.
#
# Publishing is reserved for pushed tags. Only a push can satisfy the
# verify-tag assertion that the commit has a successful "CI Complete" check -
# a dispatch has no pushed tag to check, and a v* tag can be created on any
# commit, so a dispatched publish would ship an unvalidated build. Every
# publishing step therefore carries `github.event_name == 'push'` in addition
# to `!inputs.dry_run`, and verify-tag refuses a dispatch that asks to publish
# rather than silently downgrading it to a snapshot.
#
# Triggers:
#   - push to a v* tag: real release - builds, signs, publishes
#   - workflow_dispatch: snapshot only, whatever dry_run says - no publish, no
#     signing; artifacts uploaded for inspection. dry_run=false is rejected.
#
# Mirrors seed and niac's release.yml shape so all three projects converge
# on the same release tooling.
#
# Toolchain notes:
#   Linux amd64 DEB/RPM packages include the native C reflector dataplane.
#   Tarballs, Linux arm64, Darwin, and Windows use the portable Go build.
#
# macOS .pkg:
#   pkgbuild exists only on macOS, so the macos-pkg job builds the installer
#   on a macOS runner from the darwin archive goreleaser produced (Apple
#   silicon only). The daemon is signed with the Developer ID Application
#   identity, the package with the Developer ID Installer identity, and the
#   package is notarized and stapled, so it installs by double-click. A pushed
#   tag without the signing secrets fails there rather than ship an installer
#   Gatekeeper refuses; a dispatch with sign_macos=false builds unsigned
#   and says so. Secrets: MACOS_SIGNING_P12_BASE64, MACOS_SIGNING_P12_PASSWORD
#   (one .p12 holding both identities), APPLE_NOTARY_KEY_P8_BASE64,
#   APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID. A dispatch signs and notarizes
#   too, which is how the whole chain is proven without cutting a tag.
#   After stapling it adds the .pkg's SBOM and cosign bundle, appends it to
#   checksums.txt, re-signs the final manifest, and adds it to the provenance
#   subjects.
#
# Inputs: only the typed `dry_run` boolean - no untrusted event fields
# are interpolated into shell commands.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sign_macos:
        description: "Sign and notarize the macOS .pkg for real (needs the signing secrets), which is how a dispatch proves the whole chain. Still publishes nothing. A pushed tag always signs."
        type: boolean
        default: true
      dry_run:
        description: "Must stay true: a manual run is always snapshot-only. Publishing requires pushing a v* tag."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A v* tag is enough to start a release: no ruleset restricts tag creation in
  # any fleet repo (verified 2026-08-27 — the only ruleset present is
  # merge-queue, and it targets branches). Until tag protection lands, this is
  # the gate. It refuses to build a tag whose commit never passed CI, so an
  # accidental or unauthorised tag fails here instead of producing signed,
  # published artifacts.
  #
  # The assertion is skipped for workflow_dispatch, which is the deliberate
  # dry-run path and carries no tag — but the job itself still runs and
  # succeeds, so nothing downstream is skipped.
  verify-tag:
    name: Verify tagged commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      # The condition is on the step, not the job. A job-level `if:` that
      # evaluated false would leave this SKIPPED, and a skipped `needs:` entry
      # skips everything downstream through the implicit success() — the whole
      # dry-run path would silently do nothing. As a step, the job still
      # reports success and dependents run normally.
      # A manual dispatch has no pushed tag whose commit can be checked, and a
      # v* tag can be created on any commit, so a dispatched publish would ship
      # an unvalidated build. Publishing is restricted to push events below;
      # refuse here as well so an operator who asks for one is told, rather than
      # getting a snapshot they may mistake for a release.
      - name: Refuse a manual dispatch that asks to publish
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::A $EVENT run cannot publish: only a pushed v* tag whose commit passed 'CI Complete' may. Re-run with dry_run=true for a snapshot, or push the tag."
          exit 1

      - name: Assert CI Complete succeeded for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # index() returns 0 for a first-element match, and jq's // only fires
          # on null/false — so a match at position 0 still prints 0 and passes.
          found=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI Complete") | .conclusion] | index("success") // empty')
          if [ -z "$found" ]; then
            echo "::error::No successful 'CI Complete' check run for ${GITHUB_SHA}. Refusing to release an unvalidated commit."
            exit 1
          fi
          echo "CI Complete succeeded for ${GITHUB_SHA}"

  # =========================================================================
  # UI build - done outside the goreleaser-cross container because that
  # image is Go-focused and doesn't ship Node. Vite writes directly to
  # internal/api/ui/; the next job inherits the workspace.
  # =========================================================================
  build-ui:
    name: Build UI
    needs: [verify-tag]
    runs-on: ubuntu-latest
    outputs:
      ui_hash: ${{ steps.ui-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # The Node/npm pin lives in the composite action, same as ci.yml, so
        # the release path cannot drift from what CI tested against.
        uses: ./.github/actions/setup-node
        with:
          # No npm cache on the release path. This job's output is published
          # and attested, so a poisoned cache entry restored from a branch
          # would land in a signed artifact. CI keeps its cache; releases
          # always resolve from the registry.
          cache: ""

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Compute UI build hash
        id: ui-hash
        run: |
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          echo "hash=$UI_BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload UI dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: internal/api/ui/
          retention-days: 1
          include-hidden-files: true

  # =========================================================================
  # goreleaser build + (when not dry-run) publish.
  # =========================================================================
  goreleaser:
    name: goreleaser ${{ (github.event_name == 'push' && !inputs.dry_run) && '(release)' || '(snapshot)' }}
    runs-on: ubuntu-latest
    needs: [build-ui]
    permissions:
      contents: write
      id-token: write # cosign keyless OIDC
    container:
      # Docker Hub tag scheme: <go-version>-<build-rev>-<goreleaser-version>.
      # v1.27.1-2-v2.18.2 tracks Go 1.27.1 + goreleaser v2.18.2. Pinned for
      # reproducibility; bump when newer revs land. Keep fresh so the image's
      # baked libs don't drift from upstream (seed#1577).
      image: goreleaser/goreleaser-cross:v1.27.3-4-v2.20.3@sha256:0acd8827de9901bd99082eaa846304e74e1d3c60f05c09739feabcc8aa8fdbd8
    outputs:
      # base64-encoded SHA-256 hashes of all release artifacts, formatted
      # for slsa-github-generator's base64-subjects input. Set only on a
      # real (non-snapshot) release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Mark workspace as safe (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download UI dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Install native reflector build dependencies
        # Container runs as root (no sudo) — see the "Mark workspace as safe"
        # step above for the same reason.
        #
        # A stalled Ubuntu mirror once hung apt for 25 minutes installing a
        # single package elsewhere in the fleet (niac job 95072124340),
        # because apt waits forever on a dead connection by default. Bound
        # apt's own network waits, then retry the transient case. This step
        # gates the release build, so a hang here is worse than in CI.
        #
        # clang-18 and make ship in the goreleaser-cross-toolchains base
        # image (ubuntu:noble, installs the `clang`/build-essential
        # metapackages) — only the packages not already in the image are
        # installed here.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
        with:
          packages: libbpf-dev libelf-dev libxdp-dev zlib1g-dev
          no-install-recommends: 'true'

      - name: Install Syft (SBOM) inside container
        env:
          # Pinned version + checksum (from syft's published checksums.txt),
          # matching the gitleaks-CLI pattern in ci.yml's security job —
          # `curl ... install.sh | sh` from the mutable `main` branch is a
          # supply-chain risk (a compromised main would run arbitrary code
          # in the release container). Rotate together on upgrade.
          SYFT_VERSION: "1.46.0"
          SYFT_SHA256: "d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca"
        # Container run steps default to `sh` (dash), which rejects
        # `set -o pipefail`; force bash (present in goreleaser-cross).
        shell: bash
        run: |
          set -euo pipefail
          # Downloaded into a temp dir rather than the workspace, matching the
          # Cosign step below and seed's equivalent. *.tar.gz is gitignored, so
          # this was not what goreleaser validation was being skipped for -- it
          # is hygiene, not the fix.
          syft_dir=$(mktemp -d)
          trap 'rm -rf "$syft_dir"' EXIT
          curl -sSfL -o "$syft_dir/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $syft_dir/syft.tar.gz" | sha256sum -c -
          tar -xzf "$syft_dir/syft.tar.gz" -C /usr/local/bin syft
          chmod +x /usr/local/bin/syft

      # Downloaded and executed in a job holding contents: write and
      # id-token: write, so an unverified binary here signs the release. Syft
      # two steps above was already checksummed; cosign was the outlier.
      # Checksum from the upstream cosign_checksums.txt for v3.1.3, verified
      # against sigstore's published file. Rotate both together on upgrade.
      - name: Install Cosign inside container
        shell: bash
        env:
          COSIGN_VERSION: "v3.1.3"
          COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
        run: |
          set -euo pipefail
          cosign_dir=$(mktemp -d)
          trap 'rm -rf "$cosign_dir"' EXIT
          curl -sSfL -o "$cosign_dir/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $cosign_dir/cosign-linux-amd64" | sha256sum -c -
          install -m 0755 "$cosign_dir/cosign-linux-amd64" /usr/local/bin/cosign

      # Anything that is not a pushed, non-dry-run tag is a snapshot. See the
      # publish predicate below: the two conditions are exact complements, so
      # exactly one of these steps runs on every path through this job.
      # goreleaser validates that it is building from a clean tree at the
      # expected tag. Asserting it here first means a step that drops a file in
      # the workspace fails with a message naming the file, rather than as a
      # goreleaser error whose easiest fix is to skip validation again -- which
      # is how --skip=validate came to sit on the publish path.
      - name: Assert the workspace is clean before goreleaser
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the workspace is dirty before goreleaser; a build step left files behind:"
            git status --porcelain
            exit 1
          fi
          echo "workspace clean"

      - name: Run goreleaser (snapshot/dry-run)
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --snapshot --clean --skip=publish,announce

      # The publish predicate. `github.event_name == 'push'` is what ties a
      # release to the verify-tag assertion above, which only a push can satisfy.
      - name: Run goreleaser (publish)
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Validation is on: it is what checks the build is running from a clean
        # tree at the expected tag, on the path that produces signed, attested,
        # published artifacts. The comment that used to sit here blamed the UI
        # artifact, but internal/api/ui/* is gitignored and only .gitkeep is
        # tracked, so that cannot dirty the tree. No other source is known --
        # which is why the step above asserts it rather than assuming it.
        run: goreleaser release --clean

      - name: Capture artifact hashes for SLSA provenance
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        id: hashes
        shell: bash
        run: |
          # goreleaser drops artifacts.json describing every produced
          # artifact. Filter to the user-facing ones (archive/package
          # types) and base64-encode their SHA-256 list for the
          # slsa-github-generator reusable workflow.
          set -euo pipefail
          hashes=$(jq -r '
            map(select(.type == "Archive" or .type == "Linux Package")) |
            map("\(.extra.Checksum | sub("^sha256:"; ""))  \(.name)") |
            join("\n")
          ' dist/artifacts.json | base64 -w0)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Hand the darwin archive and checksums to macos-pkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg-inputs
          path: |
            dist/stem-*-darwin-arm64.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload dry-run artifact bundle for inspection
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreleaser-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

  # =========================================================================
  # macOS .pkg - built from goreleaser's darwin archive, so the installer
  # carries the same binary the archive does. It is Developer ID signed,
  # notarized and stapled first; on a release it is then SBOM'd and
  # cosign-signed like every other artifact (after stapling, which changes the
  # bytes), appended to checksums.txt, and the final manifest is re-signed. The release is still a draft here;
  # provenance publishes it.
  # =========================================================================
  macos-pkg:
    name: macOS .pkg
    needs: [goreleaser]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # cosign keyless OIDC
    outputs:
      # base64 of the provenance subjects: goreleaser's plus the .pkg. Set
      # only on a real release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the darwin archive and checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-pkg-inputs
          path: ${{ runner.temp }}/macos-pkg-inputs/

      - name: Resolve the signing mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SIGN_MACOS: ${{ inputs.sign_macos }}
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -n "${P12_BASE64}" ] && [ -n "${P12_PASSWORD}" ] && [ -n "${NOTARY_KEY_BASE64}" ] && [ -n "${NOTARY_KEY_ID}" ] && [ -n "${NOTARY_ISSUER_ID}" ]; then
            echo "SIGN=true" >> "$GITHUB_ENV"
          elif [ "${EVENT}" = "push" ] || [ "${SIGN_MACOS}" = "true" ]; then
            echo "::error::The macOS signing secrets (MACOS_SIGNING_P12_BASE64, MACOS_SIGNING_P12_PASSWORD, APPLE_NOTARY_KEY_P8_BASE64, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID) are not all set. A release without them would ship a package Gatekeeper refuses, so it is refused."
            exit 1
          else
            echo "::warning::sign_macos is false, so the .pkg is built UNSIGNED and UN-NOTARIZED. It proves nothing about signing and must not be distributed."
            echo "SIGN=false" >> "$GITHUB_ENV"
          fi

      - name: Import signing identities
        if: ${{ env.SIGN == 'true' }}
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          # Registered before the key material exists, so the keychain is
          # removed even when the import below fails half way.
          echo "KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          echo "${P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/signing.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/signing.p12" -k "${keychain}" -P "${P12_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "${RUNNER_TEMP}/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security find-identity -v "${keychain}" | grep -F "Developer ID Application"
          security find-identity -v "${keychain}" | grep -F "Developer ID Installer"

      - name: Build the .pkg
        shell: bash
        run: |
          set -euo pipefail
          archives=("${RUNNER_TEMP}"/macos-pkg-inputs/stem-*-darwin-arm64.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected one darwin archive, found ${#archives[@]}"
            exit 1
          fi
          name="$(basename "${archives[0]}" .tar.gz)"
          version="${name#stem-}"
          version="${version%-darwin-arm64}"
          mkdir "${RUNNER_TEMP}/darwin"
          tar -xzf "${archives[0]}" -C "${RUNNER_TEMP}/darwin" stem
          if [ "${SIGN}" = "true" ]; then
            # build-pkg.sh signs the daemon (hardened runtime, secure
            # timestamp) and productbuild signs the package with the
            # Installer identity.
            export STEM_SIGN_IDENTITY="Developer ID Application"
            export STEM_INSTALLER_IDENTITY="Developer ID Installer"
          fi
          deploy/macos/build-pkg.sh "${RUNNER_TEMP}/darwin/stem" "${version}"
          echo "PKG=stem-${version}-darwin-arm64.pkg" >> "$GITHUB_ENV"

      - name: Check the signed package contract
        if: ${{ env.SIGN == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expanded="${RUNNER_TEMP}/pkg-expanded"
          pkgutil --check-signature "dist/${PKG}" | grep -F "Developer ID Installer"
          pkgutil --expand-full "dist/${PKG}" "${expanded}"
          daemon="$(find "${expanded}" -type f -path '*/usr/local/stem/stem')"
          test "$(echo "${daemon}" | wc -l)" -eq 1
          codesign --verify --strict "${daemon}"
          codesign -dvv "${daemon}" 2>&1 | grep -F "Authority=Developer ID Application"
          codesign -dv "${daemon}" 2>&1 | grep -F "flags=0x10000(runtime)"
          lipo -archs "${daemon}" | grep -Fx arm64

      - name: Notarize and staple the .pkg
        if: ${{ env.SIGN == 'true' }}
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/notary.p8"
          echo "${NOTARY_KEY_BASE64}" | base64 --decode > "${key}"
          trap 'rm -f "${key}"' EXIT
          # notarytool exits 0 for an Invalid submission, so read the verdict.
          xcrun notarytool submit "dist/${PKG}" --key "${key}" --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" --wait --output-format json > "${RUNNER_TEMP}/notary.json"
          cat "${RUNNER_TEMP}/notary.json"
          if [ "$(jq -r .status "${RUNNER_TEMP}/notary.json")" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "${RUNNER_TEMP}/notary.json")" --key "${key}" \
              --key-id "${NOTARY_KEY_ID}" --issuer "${NOTARY_ISSUER_ID}" || true
            echo "::error::notarization was not Accepted"
            exit 1
          fi
          # Stapling rewrites the package, so it runs before the SBOM, the
          # signatures and the checksum are taken.
          xcrun stapler staple "dist/${PKG}"
          xcrun stapler validate "dist/${PKG}"
          spctl --assess --type install --verbose=2 "dist/${PKG}"
          pkgutil --check-signature "dist/${PKG}"

      - name: Remove the signing keychain
        if: ${{ always() && env.SIGN == 'true' }}
        shell: bash
        run: security delete-keychain "${KEYCHAIN:-${RUNNER_TEMP}/signing.keychain-db}" || true

      - name: Upload dry-run .pkg for inspection
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg-dryrun-${{ github.run_id }}
          path: dist/${{ env.PKG }}
          if-no-files-found: error
          retention-days: 14

      - name: Install Syft and Cosign
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        # Same versions as the goreleaser job, darwin arm64 builds, each
        # checked against the upstream checksums file. Rotate together.
        env:
          SYFT_VERSION: "1.46.0"
          SYFT_SHA256: "cd4e2c40e075684a5746d8959f76b6572bb2d2dda8cf6877dbfff1cc0baeea01"
          COSIGN_VERSION: "v3.1.3"
          COSIGN_SHA256: "5cf948c2f4dfe59687bdd0b8523709067383e03982cc543475c8a7dc70e92a76"
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -sSfL -o "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_darwin_arm64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | shasum -a 256 -c -
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${bin}" syft
          curl -sSfL -o "${bin}/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-darwin-arm64"
          echo "${COSIGN_SHA256}  ${bin}/cosign" | shasum -a 256 -c -
          chmod 0755 "${bin}/syft" "${bin}/cosign"
          echo "${bin}" >> "$GITHUB_PATH"

      - name: SBOM, sign, and publish the .pkg
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          cp "${RUNNER_TEMP}/macos-pkg-inputs/checksums.txt" checksums.txt
          SYFT_FILE_METADATA_CATALOGER_ENABLED=true \
            syft "${PKG}" --output "spdx-json=${PKG}.sbom.json"
          cosign sign-blob --yes --bundle "${PKG}.cosign.bundle" "${PKG}"
          cosign sign-blob --yes --bundle "${PKG}.sbom.json.cosign.bundle" "${PKG}.sbom.json"
          shasum -a 256 "${PKG}" "${PKG}.sbom.json" >> checksums.txt
          # goreleaser signed its manifest before the .pkg existed; replace
          # that bundle with one over the final checksums.txt.
          cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt
          gh release upload "${REF_NAME}" --clobber --repo "${GITHUB_REPOSITORY}" \
            checksums.txt checksums.txt.cosign.bundle \
            "${PKG}" "${PKG}.sbom.json" "${PKG}.cosign.bundle" "${PKG}.sbom.json.cosign.bundle"

      - name: Capture provenance subjects including the .pkg
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        id: hashes
        shell: bash
        env:
          GORELEASER_HASHES: ${{ needs.goreleaser.outputs.hashes }}
        run: |
          # goreleaser's subjects (archives and Linux packages) plus the
          # .pkg, in the "<sha256>  <filename>" subject-checksums format.
          set -euo pipefail
          {
            printf '%s' "${GORELEASER_HASHES}" | base64 --decode
            echo
            shasum -a 256 "dist/${PKG}" | sed 's|  dist/|  |'
          } | sed '/^$/d' > subjects.txt
          echo "hashes=$(base64 < subjects.txt | tr -d '\n')" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # SLSA L3 provenance — runs on real releases (not dry-run).
  #
  # Uses GitHub's first-party `actions/attest-build-provenance` rather than
  # the slsa-github-generator reusable workflow. The latter (v2.1.0, the
  # current latest as of 2026-05) has a known bug in its upload-assets
  # step where UNTRUSTED_PATH is passed empty, causing the secure-download
  # action to exit 1 and the `final` job to exit 27. attest-build-provenance
  # produces the same SLSA L3 in-toto attestation (signed via Sigstore
  # keyless OIDC), surfaces it on the release's GitHub Attestations panel,
  # AND attaches the bundle file to the release as a downloadable asset.
  # Mirrors seed and niac's provenance job.
  #
  # =========================================================================
  provenance:
    name: SLSA provenance
    # Only a real release attests: a snapshot has nothing published to attest
    # against. `!cancelled()` is kept so a cancelled upstream is distinguishable
    # from a failed one.
    if: ${{ !cancelled() && github.event_name == 'push' && !inputs.dry_run && needs.goreleaser.result == 'success' && needs.macos-pkg.result == 'success' }}
    needs: [goreleaser, macos-pkg]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Sigstore OIDC signing
      contents: write       # uploading the bundle to the release
      attestations: write   # GitHub Attestations API
    steps:
      - name: Decode artifact subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ needs.macos-pkg.outputs.hashes }}" \
            | base64 -d > subjects.txt
          echo "Subjects:"
          cat subjects.txt

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects.txt

      - name: Attach attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
             stem-slsa-provenance.intoto.jsonl
          gh release upload "$TARGET_TAG" \
             stem-slsa-provenance.intoto.jsonl --clobber --repo "${GITHUB_REPOSITORY}"

      # Last step on purpose: publishing makes the release immutable, so every
      # asset, the attestation included, must already be on the draft.
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TARGET_TAG" --draft=false --repo "${GITHUB_REPOSITORY}"
