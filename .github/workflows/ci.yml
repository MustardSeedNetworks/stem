# The Stem CI Pipeline
# Mustard Seed Networks - Network Performance Testing
#
# Runs on: pull requests to main, the merge queue, manual dispatch, and a
# weekly schedule for the C jobs. A push to main does not re-run this suite.
# The merge group already tested that commit; ci-smoke.yml is the success
# signal release-please waits for.
# Shared callers (changes, backend, race, frontend, storybook, e2e) pin
# MustardSeedNetworks/.github at e092081a97245d29978e229be7425179cc1dcde1.
# That commit pins apt-install and flake-budget inside the called workflows,
# so this repo does not vendor them.
# Jobs: backend, frontend, c-lint, security, quality, build

name: CI

on:
  pull_request:
    branches: [main]
  # Required for the merge queue: `CI Complete` is a required status check, so
  # it must report on merge_group events too. Without this the queue would
  # accept PRs and then wait forever for a check that never fires.
  #
  # No `push:` trigger. This merge_group run is the test of the commit that
  # lands on main (the queue's head SHA is the main SHA). A second full suite
  # on push was cancelled while still queued during a merge burst, and
  # release-please — gated on a successful workflow_run for main — skipped
  # the commit. ci-smoke.yml is that signal now.
  merge_group:
  workflow_dispatch:
  # Weekly, for the C jobs only — see their `if:` conditions.
  #
  # Both are path-filtered on src/** and include/**, which is right for cost
  # and wrong for confidence: nothing had touched a C file in long enough that
  # the *blocking* dataplane-safety gate was red on main and simply not
  # running. Every green "CI Complete" in that window was green because the job
  # was skipped, which the aggregator correctly counts as success. A weekly run
  # puts a floor under how long that can hide. See #780.
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  # Main gets a concurrency group per commit; PRs share one group per ref.
  #
  # Push to main no longer runs this workflow (see ci-smoke.yml). The sha key
  # stays: this file still runs on main via the weekly schedule and
  # workflow_dispatch, and check-ci-conformance.py requires a main group that
  # contains github.sha. The bug it prevents is the one that dropped
  # v0.24.47 — GitHub keeps one pending run per group and cancels the older,
  # and release-please treats a cancelled run as "not a success".
  #
  # Superseded PR runs are still waste and still get cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default: every job gets read-only contents unless it
# specifically needs more (granted at the job level below). None of these
# jobs comment on or annotate PRs via the GitHub API, so pull-requests/checks
# write were unused broad grants — only the `security` job's SARIF upload
# needs security-events:write (+ actions:read, required for private repos
# per github/codeql-action/upload-sarif's docs; niac hit this exact gap).
permissions:
  contents: read

jobs:
  # ============================================================================
  # Path filter — classifies which areas changed so downstream jobs can skip
  # ============================================================================
  # The matcher is scripts/ci-changes.py in the pinned .github commit. On
  # merge_group every declared filter is true: the queue has no PR base to
  # diff against. pull_request still filters. id-token: write is how that
  # workflow reads its own commit; without it the job fails closed.
  changes:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-changes.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      filters: |
        backend:
          - '**/*.go'
          - 'go.mod'
          - 'go.sum'
          - 'Makefile'
          - 'mk/**'
          # Generated from the route registry and the Go DTOs and checked
          # against them; a hand edit to one alone must still run the gate.
          - 'docs/openapi-source.yaml'
          - 'docs/openapi.yaml'
          - 'docs/schemas/**'
        frontend:
          - 'ui/**'
        c:
          - 'src/**'
          - 'include/**'
          - 'tests/c/**'
          - 'bench/**'
          - '.clang-tidy'
          - '.clang-format'
        docs:
          - '**/*.md'
        # Everything that implements a CI gate, not just the workflow that
        # calls it. scripts/ holds the gate scripts, and a PR that weakened
        # one used to stay green because CI Complete accepts skipped.
        # .clang-tidy/.clang-format are not repeated here: the c filter
        # already covers them, and c-lint is the only job they change.
        ci_infra:
          - '.github/workflows/**'
          - '.github/actions/**'
          - 'scripts/**'
          - 'Makefile'
          - 'mk/**'
          - '.golangci.yml'
          - 'biome.json'
          - 'ui/biome.json'


  # ============================================================================
  # Build UI once, shared via artifact
  # ============================================================================
  # backend and race both need internal/api/ui/ populated (Go's //go:embed in
  # internal/api/embed_ui.go) purely to satisfy the embed and native-link
  # steps — they don't validate the UI source themselves (frontend does that).
  # Building it in each of those two jobs put the UI build on the critical
  # path twice; build it once here and let both download the artifact.
  #
  # The shared frontend workflow typechecks and tests. It does not build the
  # production bundle. This job is that build, once, for backend, race, and e2e.
  build-ui:
    name: Build UI (shared artifact)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci --prefix ui

      - name: Build
        run: npm run build --prefix ui

      - name: Upload built UI assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-ui-dist
          path: internal/api/ui/
          retention-days: 1

  # ============================================================================
  # Backend (Go, macOS, Windows) — fleet-shared ci-backend.yml
  # ============================================================================
  # One caller. The Linux job is the product gate: dataplane build, the drift
  # and policy scripts, golangci-lint, tests, and the coverage floor. macOS
  # builds and vets the tree and race-tests internal/truststore. Windows
  # builds with CGO_ENABLED=0 and tests the two packages that have Windows
  # files. Both native jobs stay off pull_request (skip-native-on-pull-request
  # defaults true): macOS runners are 10x the minutes, and the merge queue
  # still runs them because changes forces every filter true there.
  #
  # On schedule and workflow_dispatch the native jobs run whenever this caller
  # runs. That is wider than their old path filter, which required backend or
  # ci_infra. A frontend-only or C-only dispatch now builds darwin and windows
  # too. PRs still skip them.
  #
  # install-libpcap stays false. Stem's cgo deps are libbpf, libelf, libxdp,
  # and zlib, installed from pre-command. The shared apt-install step only
  # installs libpcap. vet-command is a no-op: this repo has no separate
  # `go vet` on Linux, and golangci-lint is that gate. The value is quoted
  # because the input type is string.
  backend:
    needs: [changes, build-ui]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      actions: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-backend.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      install-libpcap: false
      setup-node: true
      ui-artifact: backend-ui-dist
      ui-install: true
      golangci-lint-version: v2.14.0
      golangci-lint-args: --timeout=5m
      lint-windows: false
      fetch-depth: 0
      native-fetch-depth: 1
      timeout-minutes: 20
      vet-command: "true"
      darwin-test-command: go test -race ./internal/truststore/...
      windows-test-command: |
        go test ./internal/truststore/ -run 'ValidateCertFile' -v
        go test ./internal/authstate
      pre-command: |
        go mod download
        go mod verify
        # Bounded apt. The shared workflow's apt-install step only accepts
        # libpcap; pre-command is a shell string, so the same timeouts live
        # here. clang-18, gcc-13, and make are already on ubuntu-24.04.
        printf '%s\n' \
          'Acquire::http::Timeout "20";' \
          'Acquire::https::Timeout "20";' \
          'Acquire::Retries "2";' \
          'DPkg::Lock::Timeout "240";' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
        attempt=1
        while [ "$attempt" -le 2 ]; do
          if sudo timeout -k 15 270 apt-get update \
            && sudo timeout -k 15 270 apt-get install -y libbpf-dev libelf-dev libxdp-dev zlib1g-dev; then
            break
          fi
          echo "apt install attempt $attempt/2 failed"
          if [ "$attempt" -eq 2 ]; then
            echo "::error::native build dependencies failed to install"
            exit 1
          fi
          sleep $((attempt * 10))
          attempt=$((attempt + 1))
        done
        make CC=clang-18 dataplane
        CGO_ENABLED=1 go test -run '^$' ./internal/reflector/dataplane ./internal/services/orchestrator/dataplane
        CGO_ENABLED=1 make quick
        ldd bin/stem | grep -q libxdp
        bin/stem version
      extra-command: |
        ./scripts/check-schema-drift.sh
        ./scripts/check-types-drift.sh
        ./scripts/check-openapi-drift.sh
        ./scripts/check-output-escaping.sh
        ./scripts/check-route-policy.sh
        python3 scripts/test-check-module-feature-parity.py
        python3 scripts/check-module-feature-parity.py
        python3 scripts/test-check-component-variants.py
        python3 scripts/check-component-variants.py
        ./scripts/check-request-fields.sh
        ./scripts/check-json-casing.sh
        ./scripts/check-filename-policy.sh
        # A start limit in [Service] is silently ignored by systemd (#1249).
        ./scripts/check-service-restart-policy.sh
        python3 scripts/check-tsconfig-flags.py
        ./scripts/test-check-file-size.sh
        ./scripts/check-file-size.sh
        # getByText cannot see an aria-label, so English there is invisible to the i18n suites (#1252).
        ./scripts/test-check-aria-label-i18n.sh
        ./scripts/check-aria-label-i18n.sh
        python3 scripts/test-check-banned-vocabulary.py
        python3 scripts/check-banned-vocabulary.py
      test-command: CGO_ENABLED=0 go test -v -coverprofile=coverage.out ./...
      coverage-command: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: $COVERAGE%"
        # Anti-regression floor. Overall coverage is ~77% since the STM-6
        # ratchet. Platform code in the Linux dataplane still pulls the
        # average down; database, auth, and api are ahead of the floor.
        # Ratchet: 70 now, 75 next, 80 long-term. bc -l may print 1 or 1.0.
        MIN_COVERAGE=70
        below=$(echo "$COVERAGE < $MIN_COVERAGE" | bc -l)
        case "$below" in
          1*)
            echo "ERROR: Coverage $COVERAGE% is below minimum threshold of $MIN_COVERAGE%"
            exit 1
            ;;
        esac

  # Stays in this file. ci-backend.yml's lint-windows job cannot pass
  # only-new-issues and runs on every event. This repo has pre-existing
  # Windows findings (seed#2408); linting all of them would redden every
  # merge. The caller above sets lint-windows: false.
  # Windows-tagged Go has never been linted: golangci-lint runs on ubuntu and
  # skips *_windows.go, and the Windows job runs build/vet/tests but no linter.
  # GOOS=windows makes golangci-lint compile and lint the whole Windows tree on
  # Linux -- nothing Windows-side needs cgo -- so this costs one job, no runner.
  #
  # only-new-issues: this repo carries pre-existing findings under
  # GOOS=windows (see MustardSeedNetworks/seed#2408); gating them all would
  # block every PR. New Windows debt is blocked from today.
  #
  # pull_request only: only-new-issues needs a base to diff against, and on
  # merge_group there is none -- it would fall back to all pre-existing
  # findings and redden every merge. ci-complete accepts skipped, so this is
  # not a deadlock.
  lint-windows:
    name: Lint (GOOS=windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: Run golangci-lint for GOOS=windows
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.14.0
          only-new-issues: true
          skip-cache: true


  # ============================================================================
  # Go Race Detector — fleet-shared ci-race.yml
  # ============================================================================
  # Stem's backend tests run with CGO_ENABLED=0. The race detector needs cgo,
  # so the dataplane library has to exist first (libxdp/libbpf/libelf). Not
  # libpcap. The command stays `go test -short -race`, which is what this job
  # ran before the move.
  #
  # Go 1.26's Green Tea GC crashes intermittently under -race plus the
  # dataplane cgo bindings (mgcmark_greenteagc.go, no DATA RACE report).
  # GOEXPERIMENT=nogreenteagc keeps the result a race result. skip-network-tests
  # is false because the shared default exports SKIP_NETWORK_TESTS=1 and this
  # suite does not.
  race:
    needs: [changes, build-ui]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      actions: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-race.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      install-libpcap: false
      ui-artifact: backend-ui-dist
      skip-network-tests: false
      timeout-minutes: 20
      pre-command: |
        # Same bounded apt as the backend caller. clang-18 and make are on the image.
        printf '%s\n' \
          'Acquire::http::Timeout "20";' \
          'Acquire::https::Timeout "20";' \
          'Acquire::Retries "2";' \
          'DPkg::Lock::Timeout "240";' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
        attempt=1
        while [ "$attempt" -le 2 ]; do
          if sudo timeout -k 15 270 apt-get update \
            && sudo timeout -k 15 270 apt-get install -y libbpf-dev libelf-dev libxdp-dev zlib1g-dev; then
            break
          fi
          echo "apt install attempt $attempt/2 failed"
          if [ "$attempt" -eq 2 ]; then
            echo "::error::native build dependencies failed to install"
            exit 1
          fi
          sleep $((attempt * 10))
          attempt=$((attempt + 1))
        done
        make CC=clang-18 dataplane
      test-command: CGO_ENABLED=1 GOEXPERIMENT=nogreenteagc go test -short -race -timeout=20m ./...


  # ============================================================================
  # Frontend (TypeScript) — fleet-shared ci-frontend.yml
  # ============================================================================
  # Defaults cover `npm run typecheck` (tsc --build --noEmit) and `npm run lint`
  # (biome check src/). Token discipline runs before the tests. The coverage
  # ratchet has to follow test:coverage, so it is in the test command rather
  # than extra-command. The production bundle is build-ui; this workflow does
  # not build it again. Storybook runs in its own caller.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-frontend.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      timeout-minutes: 15
      extra-command: ../scripts/check-token-discipline.sh
      test-command: |
        npm run test:coverage
        ../scripts/check-ui-coverage.sh


  # ============================================================================
  # C Lint (C23 Standard - NOT C++)
  # ============================================================================
  c-lint:
    name: C Lint (C23)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    needs: changes
    if: >-
      needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
      || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install C23 tools (clang-tidy, cppcheck, bear)
        # clang-18, clang-tidy-18, clang-format-18 and gcc-13 ship
        # preinstalled on ubuntu-24.04 (actions/runner-images
        # Ubuntu2404-Readme.md) — only cppcheck and bear are installed here.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
        with:
          # gcc-14 is required for -std=c23: gcc-13 only knows -std=c2x,
          # and rejecting that flag is what made the compile database
          # unbuildable. libbpf-dev supplies the bpf/bpf.h that the AF_XDP
          # sources include, and libxdp-dev the xdp/xsk.h that
          # src/reflector/xdp_platform.c includes. Without them the build
          # stops at a missing header, and clang-tidy previously reported
          # that as a finding on every file pulling it in.
          packages: cppcheck bear gcc-14 libbpf-dev libxdp-dev

      - name: Set clang-18 as default and verify versions
        run: |
          # Set clang-18 as default
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

          # Verify versions
          clang --version
          clang-tidy --version
          gcc-14 --version

      - name: Check if C files exist
        id: check-c
        run: |
          if [ -d "src" ] && find src include tests/c -name '*.c' -o -name '*.h' 2>/dev/null | grep -q .; then
            echo "has_c=true" >> "$GITHUB_OUTPUT"
            echo "Found C source files"
          else
            echo "has_c=false" >> "$GITHUB_OUTPUT"
            echo "No C source files found, skipping C lint"
          fi

      # cppcheck comes from apt, so its version tracks the runner image and can
      # move without anything in this repo changing — which matters because its
      # findings differ between versions, and that is why #777 left it
      # advisory. Recording it in the log is the prerequisite for pinning it
      # (#776): a pin has to be to a version someone actually measured.
      - name: Record cppcheck version
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          cppcheck --version
          apt-cache policy cppcheck

      # The hand-written single-entry fallback that used to live here is gone.
      # It is what let this step "succeed" while producing a database covering
      # one file, so clang-tidy analysed almost nothing and reported the
      # resulting parse failures as tens of thousands of findings.
      #
      # `|| true` on bear is gone for the same reason: a compile database that
      # cannot be built is a broken toolchain, not an advisory condition.
      - name: Generate compile_commands.json
        if: steps.check-c.outputs.has_c == 'true'
        env:
          CC: gcc-14
        run: |
          set -euo pipefail
          bear -- make dataplane
          entries=$(jq 'length' compile_commands.json)
          echo "compile_commands.json entries: ${entries}"
          if [ "${entries}" -lt 1 ]; then
            echo "::error::compile_commands.json is empty — clang-tidy would analyse nothing"
            exit 1
          fi
          jq -r '.[].file' compile_commands.json

      # Pinned exact, and deliberately not the distro package. clang-format's
      # default style shifts between releases, so an unpinned binary means the
      # gate's verdict depends on which image and which laptop it ran on: this
      # tree is clean under 18.1.8, clean under Homebrew 22, and dirty under
      # Ubuntu's clang-format-18. The PyPI distribution is the same binary on
      # macOS and Linux, so `pip install clang-format==18.1.8` locally gives
      # exactly what CI runs.
      - name: Install pinned clang-format
        if: steps.check-c.outputs.has_c == 'true'
        run: pipx install clang-format==18.1.8

      # Blocking. See #776 for the three ways this job used to enforce nothing.
      - name: Run clang-format check (C23)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          clang-format --version
          find src include tests/c bench \( -name '*.c' -o -name '*.h' \) -print0 2>/dev/null | \
            xargs -0 clang-format --dry-run --Werror --style=file

      # Blocking as of #830. It was advisory while the toolchain was broken and
      # the step analysed system headers instead of this code (#823); with a
      # working compile database the real residue was 83 findings, and those are
      # now cleared. An advisory gate that nobody reads is the same as no gate.
      - name: Run clang-tidy (C23)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          echo "Running clang-tidy with C23 checks..."
          find src include tests/c bench \( -name '*.c' -o -name '*.h' \) -print0 2>/dev/null | \
            xargs -0 clang-tidy \
              --config-file=.clang-tidy \
              --extra-arg=-std=c23 \
              --extra-arg=-Iinclude \
              --warnings-as-errors='*'

      # Two real fixes here, and one deliberate non-fix.
      #
      # Fixed: `| tee` made this step report tee's status rather than
      # cppcheck's — a `run:` block is `bash -e`, not `bash -o pipefail` — so
      # the exit code was discarded before continue-on-error ever came into it.
      # And -U__APPLE__ is what lets cppcheck parse src/reflector/core.c at
      # all: it walks every preprocessor configuration, and the __APPLE__
      # branch uses Clang Blocks (`dispatch_async(q, ^{ ... })`), which it
      # cannot parse, so it abandoned the reflector hot path with a
      # syntaxError. CI builds Linux, so that branch was never the one under
      # test. The reflector is now actually analysed.
      #
      # NOT fixed: this still cannot block. cppcheck comes from apt, so its
      # version tracks the runner image and cannot be pinned the way
      # clang-format now is — 2.21 locally and 2.13 on ubuntu-24.04 disagree
      # about this tree, and a gate whose verdict depends on the image is not
      # a gate. #776 tracks pinning it; until then this reports honestly rather
      # than pretending.
      # BLOCKING as of #858. It was advisory and exiting non-zero, so real C
      # findings could not stop a merge. 51 findings were triaged; the code
      # fixes and the four suppressions below are the whole of it.
      #
      # -D__linux__ --platform=unix64 is a correctness fix, not a convenience:
      # -U__APPLE__ removes the Apple branch but never selects a platform, so
      # cppcheck was analysing the fallback stubs and reporting their dead
      # branches as defects. It accounted for 5 of 9 knownConditionTrueFalse.
      #
      # Each suppression is justified, and none is a category we simply found
      # noisy. unreadVariable and variableScope are deliberately NOT suppressed
      # -- unreadVariable is what found the dead inner_etype in
      # reflect_packet_ipv6, so it earns its place.
      #
      #   unusedStructMember      cppcheck analyses one translation unit at a
      #                           time and cannot see cross-TU use. All 25 were
      #                           false: rfc2544_payload_t::signature is read in
      #                           packet.c:175/225/230/272, and platform_ops::name
      #                           is assigned in all three platform backends.
      #   knownConditionTrueFalse 4 remain after the platform fix, all false.
      #                           `checksum == 0` (x2) is RFC 768: a computed
      #                           zero must go on the wire as 0xFFFF, and
      #                           removing that branch would be a protocol bug.
      #                           `debug_count++ < 3` (x2) is a static
      #                           rate-limiter cppcheck evaluates per call.
      #   constParameterPointer   Public API signatures (y1564_color_test and
      #   constParameterCallback  friends) and ops-vtable callbacks. Adding
      #                           const means changing headers and possibly
      #                           casting function pointers -- an API change,
      #                           tracked separately, not a lint fix.
      - name: Run cppcheck (C only)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          cppcheck --version
          echo "Running cppcheck for C code..."
          cppcheck \
            --std=c23 \
            --language=c \
            --enable=warning,style,performance,portability \
            -U__APPLE__ \
            -D__linux__ \
            --platform=unix64 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unusedStructMember \
            --suppress=knownConditionTrueFalse \
            --suppress=constParameterPointer \
            --suppress=constParameterCallback \
            --inline-suppr \
            --error-exitcode=1 \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -I include \
            src/


  # ============================================================================
  # Dataplane Safety — BLOCKING memory-safety gate for the C packet parser
  # ============================================================================
  # The dataplane parser is the one place attacker-controlled bytes meet C.
  # Unlike the advisory c-lint job above, this gate FAILS the build on:
  #   - any ASAN/UBSan finding in the parser unit tests,
  #   - a cppcheck warning-class issue in packet.c (scoped: tree-wide style
  #     findings stay advisory in c-lint),
  #   - any crash discovered by a bounded libFuzzer run of the parser.
  dataplane-safety:
    name: Dataplane Safety (ASAN + fuzz)
    runs-on: ubuntu-latest
    # 25, not 20: the reflector frame path adds a second bounded fuzz run.
    timeout-minutes: 25
    needs: changes
    if: >-
      needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
      || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install C safety dependencies
        # clang-18 ships preinstalled on ubuntu-24.04 (actions/runner-images
        # Ubuntu2404-Readme.md) — install only the packages not on the image.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
        with:
          packages: cppcheck libbpf-dev libxdp-dev

      - name: Install libFuzzer runtime (best-effort) and verify clang
        timeout-minutes: 8
        run: |
          # compiler-rt provides the libFuzzer + sanitizer runtimes. Best-effort
          # (matches the original `|| true`): some runner images already carry
          # it, so a stalled mirror here shouldn't fail the job — just bound
          # the wait the same way as the required install above.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            timeout -k 15 120 sudo apt-get install -y libclang-rt-18-dev && break
            echo "libclang-rt-18-dev install attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done || true

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          clang --version

      # The ASAN step below only catches memory faults. A logical assertion
      # failure is caught by the process exit status, so that link is gated
      # first — it was broken until 2026-08-29 and made every C assertion in
      # this job unable to fail the build.
      - name: C test harness contract (blocking)
        run: make c-test-harness-contract CC=clang

      - name: Packet-parser tests under ASAN/UBSan (blocking)
        run: make c-test-asan CC=clang

      # -D__linux__ pins a single configuration. Without it cppcheck also
      # parses the __APPLE__ branch of core.c, where a dispatch block (`^{ }`)
      # it cannot parse is a syntaxError, and evaluates the reflector against
      # the non-Linux stubs, which makes several real conditions look constant.
      # The gate runs on Linux, so the Linux configuration is the one it judges.
      - name: cppcheck gate on the parser and the reflector (blocking, warning-class)
        run: |
          cppcheck \
            --std=c23 --language=c \
            -D__linux__ \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=preprocessorErrorDirective \
            --inline-suppr \
            --error-exitcode=1 \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -I include \
            src/dataplane/common/packet.c \
            src/reflector/

      - name: Fuzz the packet parser (blocking on crash)
        run: make c-fuzz FUZZ_CC=clang FUZZ_SECONDS=120

      - name: Fuzz the reflector frame path (blocking on crash)
        run: make c-fuzz-reflector FUZZ_CC=clang FUZZ_SECONDS=120

  # ============================================================================
  # Storybook interaction and accessibility checks — fleet-shared ci-storybook.yml
  # ============================================================================
  # 37 story files existed with no runner and no CI job (#640). The shared
  # workflow splits Chromium's apt deps from the browser download and retries
  # the download. test:storybook builds Storybook, then runs the interaction
  # and accessibility tests. The contract re-runs the gate story with an
  # injected defect and requires red.
  #
  # The old frontend job also uploaded ui/storybook-static. Nothing downloaded
  # it, and this workflow has no upload input, so that artifact is gone.
  # Chromium's apt half uses the called workflow's own apt-install pin.
  storybook:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-storybook.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163


  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Always runs — security checks are non-negotiable on every PR.
    permissions:
      contents: read
      security-events: write # upload-sarif (gosec + Trivy)
      actions: read # required alongside security-events:write on private repos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      # Not a gate. High-signal gosec rules already fail the build inside
      # golangci-lint. This step only publishes SARIF, including the advisory
      # rules excluded from that gate (G204, G304, G702; see .golangci.yml).
      # Those findings are expected, so continue-on-error stays: dropping it
      # would turn the advisory rules into a second gate. The upload below is
      # the opposite and fails loudly on pull_request — a silent upload leaves
      # the Security tab showing an older scan. merge_group is the exception:
      # the queue deletes gh-readonly-queue/* as soon as the group merges or
      # is ejected, and upload-sarif then fails with "ref not found" after the
      # scan has already passed (seed, niac-go). The pull_request run already
      # published this scan.
      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        continue-on-error: true
        with:
          args: "-fmt sarif -out gosec-results.sarif ./..."

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && github.event_name != 'merge_group' && hashFiles('gosec-results.sarif') != ''
        with:
          sarif_file: gosec-results.sarif

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Run npm audit
        working-directory: ui
        run: |
          npm ci

          # npm audit's exit code conflates "the advisory endpoint is
          # unreachable" with "there is a real finding" -- a registry outage
          # on 2026-09-04 turned this job red on unrelated PRs in seed and
          # trellis, and the log read "npm error" as if it were a dependency
          # problem. --json separates the two without parsing npm's prose: a
          # transport failure returns a top-level "error" key, a completed
          # run returns metadata.vulnerabilities. Only the former is retried
          # -- a real finding will not heal in 15 seconds, and it fails
          # immediately with no delay.
          attempts=3
          delay=5
          out=""
          for attempt in $(seq 1 "$attempts"); do
            out="$(npm audit --json --audit-level=high || true)"

            if ! jq -e 'has("error")' >/dev/null 2>&1 <<<"$out"; then
              break
            fi

            endpoint="$(jq -r '(.error.summary | select(. != "")) // .message // "registry.npmjs.org advisory endpoint"' <<<"$out")"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "npm audit's advisory endpoint did not answer (attempt $attempt/$attempts): $endpoint"
              sleep "$delay"
              delay=$((delay * 3))
              continue
            fi
            echo "::error::npm audit could not reach the advisory endpoint (registry.npmjs.org) after $attempts attempts: $endpoint -- this is not a dependency finding, but the audit did not run so the gate fails rather than claiming a clean scan"
            exit 1
          done

          vulns="$(jq -e '.metadata.vulnerabilities' <<<"$out" 2>/dev/null)" || {
            echo "::error::npm audit returned no metadata.vulnerabilities -- unexpected output, failing closed"
            echo "$out"
            exit 1
          }

          high="$(jq -r '.high // 0' <<<"$vulns")"
          critical="$(jq -r '.critical // 0' <<<"$vulns")"
          total="$(jq -r '.total // 0' <<<"$vulns")"
          echo "npm audit: $total vulnerabilities found ($high high, $critical critical)"

          if [ "$((high + critical))" -gt 0 ]; then
            jq -r '(.vulnerabilities // {}) | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | "  \(.value.severity): \(.key) (\(.value.range))"' <<<"$out"
            exit 1
          fi

      # gitleaks-action requires a paid licence for organization repos. Use the
      # MIT-licensed gitleaks CLI directly instead — same engine, same config.
      # Scans full history (the security job checks out with fetch-depth: 0).
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          # SHA-256 of gitleaks_8.30.0_linux_x64.tar.gz from the upstream
          # checksums.txt. Rotate this together with GITLEAKS_VERSION on upgrade.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Run Trivy vulnerability scanner
        # exit-code is 0 here so the SARIF always gets written; we still
        # surface findings as a separate step that fails CI when the SARIF
        # contains CRITICAL/HIGH entries.
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # The SCAN above stays continue-on-error -- it is a visibility feed, not a
      # second gate (gosec runs blocking inside golangci-lint). The UPLOAD is
      # different: if it fails silently the Security tab keeps showing an older
      # scan, so the dashboard says "clean" because nothing new arrived rather
      # than because nothing was found. A stale security view is worse than an
      # absent one, so this step fails loudly on pull_request. merge_group is
      # the exception: the queue deletes gh-readonly-queue/* before the upload
      # runs, which fails the job with "ref not found" (seed, niac-go). The
      # findings gate below still reads the local SARIF.
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && github.event_name != 'merge_group' && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        # Reads the SARIF Trivy just produced and fails CI if any CRITICAL or
        # HIGH-severity result is present. Separate from the upload so a
        # pull_request still publishes to the security tab, and a merge_group
        # run still gates on the findings when that upload is skipped.
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          if jq -e '.runs[].results[] | select(.level=="error" or .properties.security_severity == "high" or .properties.security_severity == "critical")' trivy-results.sarif >/dev/null; then
            echo "::error::Trivy found CRITICAL or HIGH severity issues — see Security tab."
            jq '.runs[].results[] | {ruleId, level, severity: .properties.security_severity, message: .message.text}' trivy-results.sarif
            exit 1
          fi

  # ===========================================================================
  # Semgrep SAST — required gate (Phase 4, replaces CodeQL as the required
  # SAST signal since CodeQL is skipped entirely on private repos)
  # ===========================================================================
  # Blocking on ERROR severity only for now — a deliberate first step,
  # mirroring seed #1737. WARNING/MEDIUM findings are visible in the job log
  # but do not fail the build yet; ratchet to a stricter --severity once the
  # current WARNING backlog is triaged in a follow-up. One known false
  # positive is already annotated inline with `// nosemgrep: <rule-id> --
  # <reason>` (mirroring the existing `#nosec` justifications) so the
  # ratchet won't need to re-litigate it: internal/auth/hibp.go (SHA-1 is
  # the HIBP k-anonymity API contract).
  #
  # Runs unconditionally (no path filter) — same rationale as `security`
  # above: SAST coverage on every PR is non-negotiable, and Semgrep is fast
  # enough (~1-2 min for this ruleset) that gating it behind path filters
  # isn't worth the added complexity.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [semgrep]. Edit the pinned version / config policy there.
  # .github#174 skips the SARIF upload on merge_group; the scan and the
  # ERROR gate still run. The queue deletes gh-readonly-queue/* before
  # upload-sarif can post, and that "ref not found" failure was dropping
  # groups in seed and niac-go.
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@8f012be52b47d0be45104b0ed8d3eb72f20840f5 # .github#174
    permissions:
      contents: read
      # The shared workflow publishes the all-severity SARIF to code scanning
      # on pull_request and push. That upload is not continue-on-error, so
      # this scope is required, not optional.
      security-events: write

  # Refuses a PR that INTRODUCES a Go dependency carrying a High advisory,
  # whether or not the vulnerable symbol is ever called.
  #
  # The gap it closes is narrower than "nothing checks new dependencies", and
  # worth stating precisely: `npm audit --audit-level=high` already gates the
  # npm tree on *presence*, while govulncheck gates Go on *reachability* — it
  # passes a vulnerable module until something calls into it. The two halves of
  # the tree are held to different standards, so a Go dependency with a High
  # advisory can land unreachable and then fail CI on whatever unrelated PR
  # first calls into it. This gates the Go side on presence too, at the one
  # point where the fix is still "pick a different version". The shared
  # workflow's deny-licenses half duplicates license-check.yml — defence in
  # depth, not new coverage.
  #
  # pull_request only. The action diffs the PR's dependency manifests against
  # the base, so there is nothing for it to compare on a push or a merge_group;
  # ci-complete accepts success-or-skipped, so the skip on those events is not
  # a deadlock. Defined once in MustardSeedNetworks/.github (fleet-shared);
  # ci-complete still needs: [dependency-review].
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: MustardSeedNetworks/.github/.github/workflows/dependency-review.yml@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
    permissions:
      contents: read
      # Only to post the findings comment when it fails.
      pull-requests: write

  # Asserts this repo's own gates are wired to gate: every job below is either
  # in ci-complete's needs or documented in .github/ci-advisory-jobs.txt, the
  # enabled linters meet the declared tier, and tool installs are pinned. Two
  # such gaps were found by hand on 2026-08-16; both arrived via a merge, which
  # is why this runs per PR rather than on a schedule.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [ci-conformance]. `id-token: write` is how the reusable
  # workflow learns which commit of itself is running, so its policy checkout
  # reads the pinned commit instead of .github@main (a canonical change there
  # reaches this repo only when this pin moves).
  ci-conformance:
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
    permissions:
      contents: read
      id-token: write

  # ============================================================================
  # Quality
  # ============================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    # Measured p95 ~6s (2026-08-15 runs); 3m gives comfortable headroom.
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for unsafe logging patterns
        run: |
          echo "Checking for dangerous logging patterns..."
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
            'log\.Print.*secret'
            'fmt\.Printf.*password'
            'fmt\.Printf.*token'
          )
          VIOLATIONS=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rn -E "$pattern" --include="*.go" --exclude="*_test.go" internal/ cmd/ 2>/dev/null; then
              echo "❌ Found dangerous logging pattern: $pattern"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "ERROR: Found $VIOLATIONS unsafe logging pattern(s)"
            echo "Avoid logging sensitive data like passwords, tokens, or secrets"
            exit 1
          fi
          echo "✅ No unsafe logging patterns detected"

  # ============================================================================
  # Release notes — a release PR must still describe the tree it will tag
  # ============================================================================
  # A release PR in the merge queue has its branch locked, so release-please
  # cannot regenerate it when a commit lands on main meanwhile; the queue then
  # builds the release on top of that commit and the tag ships it with no
  # changelog entry, permanently (stem#1197). This runs the comparison on the
  # merge-queue tree, so such a release PR is ejected instead, and
  # release-please regenerates it on its next tick.
  #
  # Not path-gated and not gated on `changes`: a release PR touches only
  # CHANGELOG.md and the version files, and this is the one job that has to
  # judge exactly that PR.
  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check compares against the previous tag, so it needs the tags
          # and the commits between them.
          fetch-depth: 0

      - name: Gate self-test
        run: python3 scripts/test-check-release-notes.py

      - name: Merge queue guard self-test
        run: python3 scripts/test-merge-queue-guards.py

      # Only judge the tree that is about to land. On a push to main the
      # release commit is already history, so failing there would wedge the
      # tag rather than prevent a bad one. A pull_request run judges a merge
      # ref that never lands: while a release is pending it fails on the PR's
      # own unsquashed commits, and nothing reruns it once the release ships,
      # so the PR stays red with a stale failure (stem#1582).
      - name: An untagged release must list every commit it would ship
        if: github.event_name == 'merge_group'
        run: python3 scripts/check-release-notes.py --pending

  # ============================================================================
  # Workflow Linting
  # ============================================================================
  # Static analysis of the workflows themselves. Kept out of `quality` so it
  # runs in parallel and only when workflow files actually change.
  #   actionlint — syntax, expression and shell errors inside run: blocks.
  #   zizmor     — Actions security scanner. Blocks on High findings only.
  #                The repo is at zero High; the one that survives review
  #                (release-please.yml) carries a `# zizmor: ignore[...]`
  #                comment with the reasoning inline.
  #                Low/Informational (~27) are reported but not yet enforced.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2129 is a pure style preference about grouping `>>` redirects in
          # step summaries; the ungrouped form stays readable and diffs one
          # line at a time. Every correctness-level rule stays enabled.
          actionlint -ignore 'SC2129' -color

      - name: Run zizmor
        env:
          # zizmor resolves action refs against the API; without a token it
          # falls back to unauthenticated requests and gets rate-limited.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install zizmor==1.30.1
          zizmor --min-severity high --color always .github/workflows/

      # actionlint and zizmor check the workflows as workflows. Neither knows
      # what THIS one means: which `if:` decides that a run signs and publishes
      # rather than building a throwaway snapshot. A run that published when it
      # should not would still be green, because publishing is the success
      # path. seed's equivalent gate caught two regressions in its first week.
      #
      # The self-test runs the checker against mutated copies of the workflow
      # and fails if any is accepted -- a guard nobody tests is a guard nobody
      # knows works.
      - name: Verify release workflow contract
        run: ./scripts/test-check-release-workflow-contract.sh

      # Same reasoning: the TODO scanner is only useful if it distinguishes a
      # real marker from `context.TODO()` or an `XXXX-XXXX` key placeholder.
      # It did not, and four weeks of summary issues reported the same 15
      # non-TODOs before anyone noticed.
      - name: Verify TODO scanner
        run: ./scripts/test-scan-todos.sh

      # Same reasoning for the token-discipline rules: FAMILY_OPACITY_DIM
      # matched 13 things and meant 2 of them until #657, because nothing
      # exercised it against cases it should ignore.
      - name: Verify token-discipline rules
        run: ./scripts/test-check-token-discipline.sh

      # Build contract rule 5's deployment check could never pass a real
      # install: it compared the tag name with the version a release reports
      # (#1577). The self-test serves it a local /__version.
      - name: Verify deploy-validate
        run: ./scripts/test-deploy-validate.sh

      # A reverse dependency validate-touched fails to find is a test that
      # silently stops running in the inner loop, and a scripts/check-* gate
      # missing from its table never runs there at all.
      - name: Verify validate-touched selection and gate table
        run: python3 scripts/test-validate-touched.py

  # ============================================================================
  # Internationalization (i18n) Validation
  # ============================================================================
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.ci_infra == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checks live once in MustardSeedNetworks/.github; this repo keeps
      # only its glossary, banned vocabulary, glossary exceptions and
      # dynamic-prefix allow-list. The action installs semgrep, self-tests the
      # key checker, then validates.
      #
      # Runs unflagged: --ratchet used to demote every fixed check to an
      # annotation, so the job went green while the tree carried 74 banned
      # fallback sites and a version assertion that was wrong in all three
      # repos. See scripts/i18n/README.md and
      # msn-docs-internal/05-Engineering/I18N_CONVENTIONS.md.
      - uses: ./.github/actions/setup-node
      - name: Install frontend dependencies
        run: npm ci --prefix ui
      - name: Check help consumers and negative fixture
        run: |
          node --test scripts/check-help-i18n.test.ts
          node scripts/check-help-i18n.ts

      - name: Validate i18n (parity, glossary, banned vocab, etc.)
        uses: MustardSeedNetworks/.github/.github/actions/i18n-validate@d2aa4161d10bf8cb5a9ffb0e0985224df0faa617 # .github#105 + #106, untagged

  # ============================================================================
  # Documentation Checks
  # ============================================================================
  # Markdown lint + link check. Mirrors seed's docs job (#56). Both substeps
  # are advisory (continue-on-error) — they surface issues without blocking
  # the build, matching seed's stance that doc quality is a ratcheting goal.
  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # External link checking is NOT here: it walks every URL in every .md file,
    # measured ~6 min (the longest job in this workflow), and failed on
    # third-party link rot rather than on the change under review — which is
    # why it had been pinned to continue-on-error and enforced nothing.
    # It now runs on a schedule: .github/workflows/docs-link-check.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needed to diff against the base ref for changed-file scoping.
          fetch-depth: 0

      - name: Collect changed markdown files
        id: changed-md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD -- '*.md')
          else
            files=$(git ls-files '*.md')
          fi
          files=$(printf '%s\n' "${files}" | grep -vE '^(node_modules|build|dist|coverage)/' | grep -v 'CHANGELOG.md$' || true)
          {
            echo "files<<EOF"
            printf '%s\n' "${files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "${files}" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      # Blocking, but scoped to the files this change touches. The repo carries
      # ~490 pre-existing violations of its own .markdownlint.json; gating the
      # full tree would fail every PR, and gating nothing (the previous
      # continue-on-error) enforced nothing. Scoping ratchets the debt down as
      # files are touched, matching the file-size gate's baseline approach.
      - name: Lint changed markdown files
        if: steps.changed-md.outputs.empty != 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ steps.changed-md.outputs.files }}

  # ============================================================================
  # Build
  # ============================================================================
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [changes, build-ui, backend, frontend]
    runs-on: ${{ matrix.runner }}
    # Measured p95 ~50s (2026-08-15 runs); 8m gives comfortable headroom for
    # cold-cache Go setup + artifact download.
    timeout-minutes: 8
    # always() lets the if: evaluate when an upstream job was skipped —
    # without it the implicit success() on a job-level if: would skip this
    # job whenever any `needs` entry was skipped.
    #
    # The gate is build-ui, not frontend. These jobs consume build-ui's
    # backend-ui-dist artifact; the frontend job is the UI's *test* suite and produces nothing
    # they read. Requiring `frontend == 'success'` meant a backend-only PR —
    # where the path filter correctly skips frontend — skipped Build, the
    # Darwin compile check and E2E entirely, while CI Complete still went
    # green. Gating on the artifact's producer says what these jobs actually
    # need, and `frontend != failure` still blocks on a real UI test failure.
    # Note: matrix.required draft-skip was attempted here originally but
    # GitHub Actions rejects `matrix` in job-level if: (the matrix context
    # isn't bound until after the strategy expands). All matrix rows run
    # on every PR; per-arch arches are fast enough that the savings weren't
    # worth a workaround.
    #
    # macOS runners are 10x the minute multiplier of ubuntu-latest and are
    # NOT built here on PRs — darwin/amd64 (Intel) is dropped fleet-wide,
    # and darwin/arm64's real release binary is produced by goreleaser in
    # release.yml (unchanged). Since stem is CGO_ENABLED=0 (pure Go), the
    # darwin/arm64 build cross-compiles trivially on ubuntu; the dedicated
    # darwin-compile-check job below verifies it still compiles without
    # paying for a macOS runner on every PR.
    if: |
      always() &&
      needs.build-ui.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-ui-dist
          path: internal/api/ui/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # UI build hash matches the Makefile recipe (md5 of all embedded UI files).
          # Mandatory per CLAUDE.md Universal Build Contract — /__version must
          # return a non-empty uiBuildHash to prove the UI was embedded.
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          echo "UI_BUILD_HASH=${UI_BUILD_HASH}"

          go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X github.com/MustardSeedNetworks/stem/internal/version.Version=${VERSION} \
              -X github.com/MustardSeedNetworks/stem/internal/version.Commit=${COMMIT} \
              -X github.com/MustardSeedNetworks/stem/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/MustardSeedNetworks/stem/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o bin/stem-${{ matrix.os }}-${{ matrix.arch }} \
            ./cmd/stem/

      # `|| true` made this catch nothing: a binary that will not execute, or
      # one whose /__version reports "unknown" because the ldflags were never
      # injected, both passed silently. That second case is exactly the
      # Universal Build Contract rule this step exists to enforce, so the
      # output is asserted rather than merely produced.
      - name: Verify binary
        if: matrix.os == 'linux' && matrix.arch == 'amd64' || matrix.os == 'darwin'
        run: |
          set -euo pipefail
          out=$(./bin/stem-${{ matrix.os }}-${{ matrix.arch }} version)
          echo "$out"
          if printf '%s' "$out" | grep -qi 'unknown'; then
            echo "::error::version output contains 'unknown' — build metadata was not injected"
            exit 1
          fi

      - name: Verify UIBuildHash embedded (Universal Build Contract)
        # Static check: binary must contain the md5 hash of the embedded
        # UI, proving the -X ...UIBuildHash=... ldflag was set in
        # `Build binary`. Failure means /__version would return
        # uiBuildHash="unknown" in prod — silent contract violation.
        # Only runs for native linux/amd64 + darwin (where `strings`
        # is available); cross-compiled arm64 binary uses identical
        # build command so it's covered by the amd64 check.
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          if [ -z "$(find internal/api/ui -mindepth 1 ! -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            echo "::error::internal/api/ui is empty — backend-ui-dist artifact missing?"
            exit 1
          fi
          EXPECTED=$(find internal/api/ui -type f -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          if [ "${#EXPECTED}" -ne 32 ]; then
            echo "::error::Computed UI_BUILD_HASH is not 32 chars: '$EXPECTED'"
            exit 1
          fi
          echo "Expected UIBuildHash: $EXPECTED"
          if strings ./bin/stem-${{ matrix.os }}-${{ matrix.arch }} | grep -qF "$EXPECTED"; then
            echo "  ✓ UIBuildHash embedded correctly"
          else
            echo "::error::Binary does not contain UIBuildHash $EXPECTED"
            echo "  → Universal Build Contract violated. Check -X ...UIBuildHash=... ldflag in 'Build binary' step."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stem-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/stem-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # ============================================================================
  # Darwin compile check — verifies the release target still cross-compiles
  # ============================================================================
  # macOS runners cost 10x the ubuntu-latest minute multiplier, so darwin
  # binaries are no longer built on PRs at all (see the `build` job comment
  # above). stem is CGO_ENABLED=0 (pure Go), so GOOS=darwin GOARCH=arm64
  # cross-compiles cleanly on ubuntu-latest — this job is a cheap compile-only
  # smoke check that the darwin/arm64 target hasn't broken, without paying for
  # a macOS runner. The actual signed darwin/arm64 release binary is still
  # produced by goreleaser in release.yml, unchanged. darwin/amd64 (Intel) is
  # dropped fleet-wide and is not checked here.
  darwin-compile-check:
    name: Darwin compile check (arm64)
    runs-on: ubuntu-latest
    # Measured p95 ~45s (2026-08-15 runs); 5m gives comfortable headroom.
    timeout-minutes: 5
    needs: [changes, build-ui, backend, frontend]
    if: |
      always() &&
      needs.build-ui.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-ui-dist
          path: internal/api/ui/

      - name: Cross-compile for darwin/arm64 (no macOS runner needed)
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -trimpath -o /dev/null ./cmd/stem/

  # ============================================================================
  # E2E Browser Tests (Playwright) — fleet-shared ci-e2e.yml
  # ============================================================================
  # Sharded chromium and webkit, plus a separate @smoke job, inside the
  # pinned Playwright image. The image ships the browsers, so the shard never
  # calls apt. The daemon is built on ubuntu-24.04 (the image's Ubuntu
  # release) with scripts/build-backend-e2e.sh — CGO_ENABLED=0, full git
  # history so `git describe` can see tags — and the shards download it.
  # upload-artifact stores a single file at the artifact root, so the build
  # copies bin/stem to stem-e2e and prepare puts it back at bin/stem.
  #
  # The server start matches the old job: fixed port 8444, the same rate-limit
  # overrides, readiness on /health/ready. scripts/run-e2e.sh is not used
  # here; it needs python3 to pick a port, and the Playwright image does not
  # guarantee that. Each shard and the smoke job start their own daemon.
  #
  # Drafts skip the caller, so the check is skipped rather than a green
  # workflow whose inner jobs were skipped. !cancelled() keeps a cancelled
  # run from launching shards. A failed or skipped backend/frontend still
  # reaches this if; build-ui has to have succeeded because the daemon embeds
  # that artifact.
  e2e:
    needs: [changes, build-ui, backend, frontend]
    if: |
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.build-ui.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    permissions:
      contents: read
      actions: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-e2e.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      backend-result: ${{ needs.backend.result }}
      frontend-result: ${{ needs.frontend.result }}
      playwright-image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      ui-artifact: backend-ui-dist
      fetch-depth: 0
      build-daemon: true
      static-libpcap: false
      daemon-build-command: |
        ./scripts/build-backend-e2e.sh
        cp bin/stem stem-e2e
      daemon-binary: stem-e2e
      daemon-artifact: stem-e2e-daemon
      timeout-minutes: 20
      prepare-command: |
        mkdir -p bin
        cp stem-e2e bin/stem
        chmod +x bin/stem
        # Same overrides as the previous inline step. Raised, not disabled:
        # the override cannot go below the compiled-in default, so the
        # middleware stays wired. One daemon per shard, one runner IP.
        export STEM_AUTH_USERNAME=admin
        export STEM_AUTH_PASSWORD=admin
        export STEM_API_RATE_LIMIT=5000
        export STEM_AUTH_RATE_LIMIT=200
        nohup ./bin/stem web -p 8444 > server.log 2>&1 &
        echo "Waiting for server to start..."
        i=1
        while [ "$i" -le 30 ]; do
          if curl -skf https://localhost:8444/health/ready 2>/dev/null; then
            echo "Server ready after $i attempts"
            exit 0
          fi
          echo "Attempt $i: Server not ready, waiting..."
          if [ "$i" -lt 5 ]; then
            sleep 1
          else
            sleep 2
          fi
          i=$((i + 1))
        done
        echo "Server failed to start after 30 attempts"
        cat server.log
        exit 1
      test-command: cd ui && E2E_BASE_URL=https://localhost:8444 PLAYWRIGHT_IGNORE_HTTPS_ERRORS=true npx playwright test --project="$BROWSER" --grep-invert @smoke --shard="$SHARD/$SHARD_COUNT"
      smoke-command: cd ui && E2E_BASE_URL=https://localhost:8444 PLAYWRIGHT_IGNORE_HTTPS_ERRORS=true npx playwright test --grep @smoke


  # Phone width (owner 2026-09-15: everything works at 390x844). The fleet's one
  # definition of "works" lives in MustardSeedNetworks/.github; this job points
  # it at stem's own daemon, since every route is behind a session and a static
  # serve would answer each one with the login screen. The binary is the
  # CGO-free E2E build, started by the same script as scripts/run-e2e.sh;
  # phone-width-sign-in.ts signs it in with the gate's own Playwright. `routes`
  # must equal pageRegistry's paths — src/pageRegistry.test.tsx fails when the
  # two diverge.
  phone-width:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/phone-width.yml@042e037814c114aadc2b8b2caaedfba8e0149018 # .github#88, untagged
    with:
      base-url: https://localhost:8444
      prepare-command: ./scripts/build-backend-e2e.sh
      start-command: ./scripts/e2e-daemon.sh "$RUNNER_TEMP/stem-phone-width" 8444
      setup-command: node ui/e2e/phone-width-sign-in.ts
      storage-state: phone-width-state.json
      routes: '["/reflector", "/tests/benchmark", "/tests/servicetest", "/tests/trafficgen", "/tests/measure", "/tests/certify", "/history", "/account/security"]'
      rail-testid: desktop-sidebar
      primary-action-testid: start-test-button

  # ============================================================================
  # Reflect-Path Performance Gate
  # ============================================================================
  # stem measures network performance, so a throughput regression in the reflect
  # path is a correctness regression -- and until #860 nothing in CI would catch
  # one: tests/c/ covers behaviour, tests/load/ drives the HTTP API, and the
  # sanitizer targets cover memory safety.
  #
  # The comparison is same-runner A/B: the baseline revision and the PR head are
  # both built and measured on this runner, in this job. Absolute packets-per-
  # second is a property of the machine, so a recorded constant would false-
  # positive whenever the runner class or its neighbours changed. A/B also means
  # a genuine improvement re-baselines itself on merge, with no committed figure
  # to remember to update.
  #
  # The gate fails closed -- a build that does not compile, a binary that does
  # not run, or output with no BENCH records all fail the job.
  c-bench:
    name: C Performance (reflect path)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: >-
      needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
      || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The baseline is a merge-base, so the comparison needs real history:
          # a shallow clone has no commit to diff against and the gate would
          # skip on every run.
          fetch-depth: 0

      - name: Install gcc-14
        # ubuntu-24.04's default gcc is 13, which only knows -std=c2x and
        # rejects the -std=c23 the Makefile and this benchmark use. Same reason
        # c-lint installs it.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
        with:
          packages: gcc-14

      # Blocking again as of #965: three PRs were false-failed in one day on
      # three DIFFERENT cases with identical code, which is what showed the
      # noise was the machine and not any one case. The measurement now takes
      # the best of 30 interleaved rounds per side. Best-of-15 still produced
      # an isolated -16.6% false failure on an unrelated Go/CI-only change
      # (#1123). The reasoning and measured history are in
      # scripts/bench-compare.sh above BENCH_RUNS.
      #
      # It false-failed again anyway, and more rounds was not the answer: the
      # queue runs this job on every PR whatever it touched, so most runs
      # compare a tree with itself and report pure runner noise — -25.0%
      # and -27.3% on a package-lock.json-only PR (run 34687252273), which
      # ejected it from the queue. The script now skips a diff that cannot reach the
      # benchmark; #1198. "Cannot reach" means the two benchmark binaries are
      # byte-identical, not that src/ and include/ are untouched: a Y.1731 fix
      # never reaches the reflect path and was still ejected twice (#1697).
      #
      # If it false-fails on a change that DOES touch the reflect path, the
      # answer is more rounds or a quieter runner — not `continue-on-error` and
      # not a wider BENCH_MAX_REGRESSION_PCT, which would stop it catching a
      # real regression too.

      # A gate nobody tests is a gate nobody knows the shape of: this proves
      # the skip fires only when the measured code is unchanged, and that a
      # changed reflect path is still measured.
      - name: Verify the benchmark gate measures only reflect-path changes
        env:
          CC: gcc-14
        run: scripts/test-bench-compare.sh

      - name: Compare reflect-path throughput against the merge base
        env:
          CC: gcc-14
        run: scripts/bench-compare.sh

  # ============================================================================
  # CI Complete — dispatcher / branch-protection aggregator
  # ============================================================================
  # Every required-status-check on `main` is consolidated into this single
  # job. It fails if any upstream job actually failed; it passes if every
  # upstream either succeeded or was intentionally skipped via the path
  # filter. Branch protection requires ONLY "CI Complete" (plus "Lint PR
  # Title" / "Lint PR Body" from their own workflows) rather than
  # enumerating every individual job — so a docs-only PR can merge cleanly
  # when backend/frontend/c are all skipped. CodeQL and license-check are
  # NOT required contexts: CodeQL is advisory (and skips entirely on
  # private repos) and license-check reports without blocking. The
  # `semgrep` job in this file is the required SAST gate (blocking on
  # ERROR severity).
  # Fails the build on any open High/Critical CodeQL alert on the default
  # branch. The CodeQL job itself reports success when the *analysis* succeeds,
  # regardless of what it found, so without this a repository can carry open
  # High alerts with every check green. Scoped to CodeQL rather than "any High
  # alert": the code-scanning tab also carries Scorecard *scores* at High
  # severity, several of which encode deliberate decisions.
  codeql-alert-gate:
    name: CodeQL Alert Gate
    uses: MustardSeedNetworks/.github/.github/workflows/codeql-alert-gate.yml@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
    permissions:
      security-events: read

  # Not the shared ci-complete.yml. GitHub would report that check as
  # `ci-complete / CI Complete`. Branch protection and release.yml require
  # the plain name `CI Complete`, so the aggregator stays in this file.
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NOTE: e2e now gates, matching niac-go. It was advisory because browser
    # downloads were a flaky external dependency — that was fixed by the
    # bounded apt-install retry, so the original reason no longer holds and an
    # ungated 200s job was the worst of both worlds.
    # They were dropped from required-status-checks on main because they're
    # advisory (flaky / surface real issues that are tracked separately).
    # Including them here would re-block merge via the dispatcher on the
    # same flakes. They still run on every PR and surface their own status;
    # they just don't gate merge.
    needs:
      - changes
      - build-ui
      - backend
      - lint-windows
      - race
      - frontend
      - storybook
      - c-lint
      - dataplane-safety
      - c-bench
      - security
      - semgrep
      - dependency-review
      - ci-conformance
      - quality
      - release-notes
      - workflow-lint
      - i18n
      - docs
      - build
      - darwin-compile-check
      - e2e
      - phone-width
      - codeql-alert-gate
    # !cancelled(), not always(). always() still runs after a cancellation
    # and then fails, because the upstream results are "cancelled", so a
    # cancelled workflow is recorded as a failure. Real failures still reach
    # this job and still fail it.
    if: ${{ !cancelled() }}
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
