# The Stem CI Pipeline
# Mustard Seed Networks - Network Performance Testing
#
# Runs on: push to main, pull requests to main
# Jobs: backend, frontend, c-lint, security, quality, build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required for the merge queue: `CI Complete` is a required status check, so
  # it must report on merge_group events too. Without this the queue would
  # accept PRs and then wait forever for a check that never fires.
  merge_group:
  workflow_dispatch:
  # Weekly, for the C jobs only — see their `if:` conditions.
  #
  # Both are path-filtered on src/** and include/**, which is right for cost
  # and wrong for confidence: nothing had touched a C file in long enough that
  # the *blocking* dataplane-safety gate was red on main and simply not
  # running. Every green "CI Complete" in that window was green because the job
  # was skipped, which the aggregator correctly counts as success. A weekly run
  # puts a floor under how long that can hide. See #780.
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets read-only contents unless it
# specifically needs more (granted at the job level below). None of these
# jobs comment on or annotate PRs via the GitHub API, so pull-requests/checks
# write were unused broad grants — only the `security` job's SARIF upload
# needs security-events:write (+ actions:read, required for private repos
# per github/codeql-action/upload-sarif's docs; niac hit this exact gap).
permissions:
  contents: read

jobs:
  # ============================================================================
  # Path filter — classifies which areas changed so downstream jobs can skip
  # ============================================================================
  # Adds ~5s to every run; saves several minutes when a PR only touches one
  # area (docs-only / c-only / frontend-only). The CI Complete aggregator at
  # the bottom of this file enforces that all required jobs either passed or
  # were intentionally skipped, so branch protection can require just CI
  # Complete instead of every individual job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # merge_group has no PR base to diff against, and the queue exists to test
      # the merged result — so every filter reports true there and the full
      # suite runs. Path filtering stays in effect for pull_request/push.
      backend: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.frontend }}
      c: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.c }}
      docs: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.docs }}
      ci_infra: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.ci_infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'mk/**'
            frontend:
              - 'ui/**'
            c:
              - 'src/**'
              - 'include/**'
              - 'tests/c/**'
              - '.clang-tidy'
              - '.clang-format'
            docs:
              - '**/*.md'
            # Everything that *implements* a CI gate, not just the workflow
            # that calls it. scripts/ holds ~20 gate scripts — including
            # check-output-escaping.sh and check-route-policy.sh, which enforce
            # the security invariants — and no filter matched them, so a PR
            # could weaken a gate and stay green: CI Complete accepts `skipped`.
            # This replaces the old `workflows` class; every job that OR'd that
            # now ORs this. The rule is simply: if it decides a verdict, a change
            # to it re-runs the suite.
            #
            # .clang-tidy/.clang-format are deliberately NOT repeated here — the
            # `c` class above already covers them, and c-lint is the only job
            # whose verdict they change.
            ci_infra:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - '.golangci.yml'
              - 'biome.json'
              - 'ui/biome.json'

  # ============================================================================
  # Build UI once, shared via artifact
  # ============================================================================
  # backend and race both need internal/api/ui/ populated (Go's //go:embed in
  # internal/api/embed_ui.go) purely to satisfy the embed and native-link
  # steps — they don't validate the UI source themselves (frontend does that).
  # Building it in each of those two jobs put the UI build on the critical
  # path twice; build it once here and let both download the artifact.
  #
  # frontend is NOT wired to this job — it builds the UI as the thing under
  # test (types/lint/Vitest/Storybook), so it keeps building its own copy.
  build-ui:
    name: Build UI (shared artifact)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci --prefix ui

      - name: Build
        run: npm run build --prefix ui

      - name: Upload built UI assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-ui-dist
          path: internal/api/ui/
          retention-days: 1

  # ============================================================================
  # Backend (Go)
  # ============================================================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-ui]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Download built UI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-ui-dist
          path: internal/api/ui/

      - name: Install UI dependencies
        # npm ci (not a build) — needed by check-types-drift.sh, which runs
        # `npm --prefix ui run gen-types`. The actual built UI assets come
        # from the build-ui job's shared artifact, downloaded above.
        run: npm ci --prefix ui

      - name: Install native build dependencies
        # clang-18, gcc-13 and make ship preinstalled on ubuntu-24.04
        # (actions/runner-images Ubuntu2404-Readme.md) — only the packages
        # not already on the image are installed here.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        with:
          packages: libbpf-dev libelf-dev libxdp-dev zlib1g-dev

      - name: Build native dataplane library
        run: make CC=clang-18 dataplane

      - name: Compile native Go bindings
        run: CGO_ENABLED=1 go test -run '^$' ./internal/reflector/dataplane ./internal/services/orchestrator/dataplane

      - name: Verify native Linux release linkage
        run: |
          CGO_ENABLED=1 make quick
          ldd bin/stem | grep -q libxdp
          bin/stem version

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          # Full-tree lint verified clean on 2026-08-14. Keep CI aligned with
          # the repository-wide zero-warning policy.
          args: --timeout=5m

      - name: Verify API schemas are up to date
        run: ./scripts/check-schema-drift.sh

      - name: Verify generated TS types are up to date
        run: ./scripts/check-types-drift.sh

      - name: Output-escaping / XSS gate (#343)
        run: ./scripts/check-output-escaping.sh

      - name: Route-policy gate (capability registry)
        run: ./scripts/check-route-policy.sh

      - name: JSON wire-casing gate — camelCase ratchet
        run: ./scripts/check-json-casing.sh

      - name: Filename-policy gate — no monolith naming outside internal/api
        run: ./scripts/check-filename-policy.sh

      # The four products each own their tsconfig, so the strictness flags
      # drift silently — a missing one never announces itself, it just checks
      # less than its sibling does.
      - name: TypeScript strictness contract
        run: python3 scripts/check-tsconfig-flags.py

      - name: File-size gate (baseline-ratchet)
        # Adopts niac-go's implementation so all three repos share one gate.
        # Red-flag files present at adoption are recorded in
        # scripts/file-size-baseline.txt with their current size and may not
        # grow; anything new or increased fails. stem's baseline is empty —
        # it had already paid its debt down under the previous STRICT=1 mode.
        run: ./scripts/check-file-size.sh

      - name: Banned-vocabulary gate (strategy reset)
        # Ported from seed, which was the only repo enforcing it. Catches
        # retired tier names and AI vocabulary in customer-facing copy —
        # it found "TestSuite (Tier 2)" still shipping in docs/man/*.1.
        run: |
          python3 scripts/test-check-banned-vocabulary.py
          python3 scripts/check-banned-vocabulary.py

      - name: Run tests
        run: CGO_ENABLED=0 go test -v -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"

          # Minimum coverage threshold. Acts as an anti-regression floor.
          # Overall coverage is ~58% (platform-specific code in Linux
          # dataplane and TUI pulls the average down; critical packages —
          # auth, database, logging, modules, config — are 90%+).
          #
          # Ratchet plan (raise after each release exceeds the next tier
          # by 5+ points):
          #   2026-Q2: 50 (current)
          #   2026-Q3: 55
          #   2026-Q4: 60
          #   2027-Q2: 65
          #   long-term: 70
          MIN_COVERAGE=50

          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "ERROR: Coverage ${COVERAGE}% is below minimum threshold of ${MIN_COVERAGE}%"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

  # ============================================================================
  # Go Race Detector
  # ============================================================================
  # Dedicated race-only job to match seed's CI matrix (#56). Stem's main
  # backend tests run under CGO_ENABLED=0; the race detector requires cgo,
  # which means the dataplane cgo bindings need libxdp/libbpf/libelf at link
  # time. Install the same native deps as the Backend (Go) job and build
  # libreflector.a before invoking go test.
  race:
    name: Backend (race detector)
    runs-on: ubuntu-latest
    # NOT sized from p95. p95 (~1m20s, 2026-08-15) only describes runs where
    # apt was fast, so budgeting to it guarantees the pathological run dies.
    # This job contains a 10-minute apt step, so 5m could never have failed
    # cleanly — a slow mirror killed the job instead of the step. See the e2e
    # job for the incident this rule came from.
    timeout-minutes: 20
    needs: [changes, build-ui]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
    env:
      GOMODCACHE: ${{ github.workspace }}/.cache/go/pkg/mod
      GOCACHE: ${{ github.workspace }}/.cache/go/build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Download built UI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-ui-dist
          path: internal/api/ui/

      - name: Install native build dependencies
        # clang-18, gcc-13 and make ship preinstalled on ubuntu-24.04
        # (actions/runner-images Ubuntu2404-Readme.md) — only the packages
        # not already on the image are installed here.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        with:
          packages: libbpf-dev libelf-dev libxdp-dev zlib1g-dev

      - name: Build native dataplane library
        run: make CC=clang-18 dataplane

      - name: Run tests with race detector
        env:
          CGO_ENABLED: '1'
          # Go 1.26 enables the Green Tea GC by default. It crashes
          # intermittently under `-race` + CGO (the dataplane bindings) with
          # a fatal error inside mgcmark_greenteagc.go — a toolchain bug, not
          # an application data race (no "DATA RACE" report). Pin the prior
          # GC for this job so race results are deterministic. Remove once
          # the upstream greentea+race+cgo crash is fixed.
          GOEXPERIMENT: nogreenteagc
        run: go test -short -race -timeout=20m ./...

  # ============================================================================
  # Frontend (TypeScript)
  # ============================================================================
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npx @biomejs/biome check src/

      - name: Design token discipline (Phase 0 gate)
        run: ../scripts/check-token-discipline.sh

      - name: Type check
        run: npm run typecheck

      # This job built and linted the frontend but never ran its tests. 34 test
      # files and 218 cases existed and executed zero times in CI; the only
      # frontend test commands anywhere in this workflow were the Storybook
      # ones. They all pass — measured locally at 218/218 in ~7s — so this is
      # a gate that was simply never wired, not a suite that was failing.
      #
      # `npm run test`, not `test:coverage`: the thresholds in vitest.config.ts
      # (88/80/92/88) are not currently met — the real numbers are 69.06
      # statements, 63.22 branches, 46.68 functions, 72.03 lines. That is
      # genuine coverage debt that accrued while this gate was off, and closing
      # it is test-writing work, not a CI change. Lowering the thresholds to
      # today's numbers would redefine the standard rather than meet it.
      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/
          retention-days: 1

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir storybook-static --quiet
        working-directory: ui

      - name: Upload Storybook static
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: ui/storybook-static/
          retention-days: 7

  # ============================================================================
  # C Lint (C23 Standard - NOT C++)
  # ============================================================================
  c-lint:
    name: C Lint (C23)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    needs: changes
    if: >-
      needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
      || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install C23 tools (clang-tidy, cppcheck, bear)
        # clang-18, clang-tidy-18, clang-format-18 and gcc-13 ship
        # preinstalled on ubuntu-24.04 (actions/runner-images
        # Ubuntu2404-Readme.md) — only cppcheck and bear are installed here.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        with:
          # gcc-14 is required for -std=c23: gcc-13 only knows -std=c2x,
          # and rejecting that flag is what made the compile database
          # unbuildable. libbpf-dev supplies the bpf/bpf.h that the AF_XDP
          # sources include, and libxdp-dev the xdp/xsk.h that
          # src/reflector/xdp_platform.c includes. Without them the build
          # stops at a missing header, and clang-tidy previously reported
          # that as a finding on every file pulling it in.
          packages: cppcheck bear gcc-14 libbpf-dev libxdp-dev

      - name: Set clang-18 as default and verify versions
        run: |
          # Set clang-18 as default
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

          # Verify versions
          clang --version
          clang-tidy --version
          gcc-14 --version

      - name: Check if C files exist
        id: check-c
        run: |
          if [ -d "src" ] && find src include tests/c -name '*.c' -o -name '*.h' 2>/dev/null | grep -q .; then
            echo "has_c=true" >> "$GITHUB_OUTPUT"
            echo "Found C source files"
          else
            echo "has_c=false" >> "$GITHUB_OUTPUT"
            echo "No C source files found, skipping C lint"
          fi

      # cppcheck comes from apt, so its version tracks the runner image and can
      # move without anything in this repo changing — which matters because its
      # findings differ between versions, and that is why #777 left it
      # advisory. Recording it in the log is the prerequisite for pinning it
      # (#776): a pin has to be to a version someone actually measured.
      - name: Record cppcheck version
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          cppcheck --version
          apt-cache policy cppcheck

      # The hand-written single-entry fallback that used to live here is gone.
      # It is what let this step "succeed" while producing a database covering
      # one file, so clang-tidy analysed almost nothing and reported the
      # resulting parse failures as tens of thousands of findings.
      #
      # `|| true` on bear is gone for the same reason: a compile database that
      # cannot be built is a broken toolchain, not an advisory condition.
      - name: Generate compile_commands.json
        if: steps.check-c.outputs.has_c == 'true'
        env:
          CC: gcc-14
        run: |
          set -euo pipefail
          bear -- make dataplane
          entries=$(jq 'length' compile_commands.json)
          echo "compile_commands.json entries: ${entries}"
          if [ "${entries}" -lt 1 ]; then
            echo "::error::compile_commands.json is empty — clang-tidy would analyse nothing"
            exit 1
          fi
          jq -r '.[].file' compile_commands.json

      # Pinned exact, and deliberately not the distro package. clang-format's
      # default style shifts between releases, so an unpinned binary means the
      # gate's verdict depends on which image and which laptop it ran on: this
      # tree is clean under 18.1.8, clean under Homebrew 22, and dirty under
      # Ubuntu's clang-format-18. The PyPI distribution is the same binary on
      # macOS and Linux, so `pip install clang-format==18.1.8` locally gives
      # exactly what CI runs.
      - name: Install pinned clang-format
        if: steps.check-c.outputs.has_c == 'true'
        run: pipx install clang-format==18.1.8

      # Blocking. See #776 for the three ways this job used to enforce nothing.
      - name: Run clang-format check (C23)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          clang-format --version
          find src include tests/c \( -name '*.c' -o -name '*.h' \) -print0 2>/dev/null | \
            xargs -0 clang-format --dry-run --Werror --style=file

      # Blocking as of #830. It was advisory while the toolchain was broken and
      # the step analysed system headers instead of this code (#823); with a
      # working compile database the real residue was 83 findings, and those are
      # now cleared. An advisory gate that nobody reads is the same as no gate.
      - name: Run clang-tidy (C23)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          echo "Running clang-tidy with C23 checks..."
          find src include tests/c \( -name '*.c' -o -name '*.h' \) -print0 2>/dev/null | \
            xargs -0 clang-tidy \
              --config-file=.clang-tidy \
              --extra-arg=-std=c23 \
              --extra-arg=-Iinclude \
              --warnings-as-errors='*'

      # Two real fixes here, and one deliberate non-fix.
      #
      # Fixed: `| tee` made this step report tee's status rather than
      # cppcheck's — a `run:` block is `bash -e`, not `bash -o pipefail` — so
      # the exit code was discarded before continue-on-error ever came into it.
      # And -U__APPLE__ is what lets cppcheck parse src/reflector/core.c at
      # all: it walks every preprocessor configuration, and the __APPLE__
      # branch uses Clang Blocks (`dispatch_async(q, ^{ ... })`), which it
      # cannot parse, so it abandoned the reflector hot path with a
      # syntaxError. CI builds Linux, so that branch was never the one under
      # test. The reflector is now actually analysed.
      #
      # NOT fixed: this still cannot block. cppcheck comes from apt, so its
      # version tracks the runner image and cannot be pinned the way
      # clang-format now is — 2.21 locally and 2.13 on ubuntu-24.04 disagree
      # about this tree, and a gate whose verdict depends on the image is not
      # a gate. #776 tracks pinning it; until then this reports honestly rather
      # than pretending.
      - name: Run cppcheck (C only, advisory until pinned — see #776)
        if: steps.check-c.outputs.has_c == 'true'
        continue-on-error: true
        run: |
          cppcheck --version
          echo "Running cppcheck for C code..."
          cppcheck \
            --std=c23 \
            --language=c \
            --enable=warning,style,performance,portability \
            -U__APPLE__ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --error-exitcode=1 \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -I include \
            src/


  # ============================================================================
  # Dataplane Safety — BLOCKING memory-safety gate for the C packet parser
  # ============================================================================
  # The dataplane parser is the one place attacker-controlled bytes meet C.
  # Unlike the advisory c-lint job above, this gate FAILS the build on:
  #   - any ASAN/UBSan finding in the parser unit tests,
  #   - a cppcheck warning-class issue in packet.c (scoped: tree-wide style
  #     findings stay advisory in c-lint),
  #   - any crash discovered by a bounded libFuzzer run of the parser.
  dataplane-safety:
    name: Dataplane Safety (ASAN + fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: >-
      needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
      || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cppcheck
        # clang-18 ships preinstalled on ubuntu-24.04 (actions/runner-images
        # Ubuntu2404-Readme.md) — only cppcheck is installed here.
        timeout-minutes: 10
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        with:
          packages: cppcheck

      - name: Install libFuzzer runtime (best-effort) and verify clang
        timeout-minutes: 8
        run: |
          # compiler-rt provides the libFuzzer + sanitizer runtimes. Best-effort
          # (matches the original `|| true`): some runner images already carry
          # it, so a stalled mirror here shouldn't fail the job — just bound
          # the wait the same way as the required install above.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            timeout -k 15 120 sudo apt-get install -y libclang-rt-18-dev && break
            echo "libclang-rt-18-dev install attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done || true

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          clang --version

      - name: Packet-parser tests under ASAN/UBSan (blocking)
        run: make c-test-asan CC=clang

      - name: cppcheck gate on the parser (blocking, warning-class)
        run: |
          cppcheck \
            --std=c23 --language=c \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=preprocessorErrorDirective \
            --inline-suppr \
            --error-exitcode=1 \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -I include \
            src/dataplane/common/packet.c

      - name: Fuzz the packet parser (blocking on crash)
        run: make c-fuzz FUZZ_CC=clang FUZZ_SECONDS=120

  # ============================================================================
  # Storybook interaction and accessibility checks
  # ============================================================================
  # 37 story files existed with no runner and no CI job — carried as
  # maintenance weight and a Renovate surface while enforcing nothing (#640).
  storybook:
    name: Storybook interactions and accessibility
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      # Split from the browser download because `--with-deps` runs apt, and
      # bundling them leaves the apt half with no step budget and no dpkg lock
      # bound. seed lost a whole 15-minute job budget to exactly that.
      - name: Install Chromium OS dependencies
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        timeout-minutes: 10
        with:
          # cd ui explicitly: the job's defaults.run.working-directory does not
          # reach inside a composite action's own steps.
          command: cd ui && node ./node_modules/playwright/cli.js install-deps chromium

      - name: Install Chromium
        timeout-minutes: 10
        run: node ./node_modules/playwright/cli.js install chromium

      - name: Run interaction and accessibility tests
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: npm run test:storybook

      # A harness that has never been shown to fail is not worth trusting.
      # This re-runs the gate story with a defect injected — once broken
      # interaction, once an accessibility violation — and requires red.
      - name: Verify injected defects fail the gate
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: npm run test:storybook:contract

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Always runs — security checks are non-negotiable on every PR.
    permissions:
      contents: read
      security-events: write # upload-sarif (gosec + Trivy)
      actions: read # required alongside security-events:write on private repos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Run gosec
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        continue-on-error: true
        with:
          args: "-fmt sarif -out gosec-results.sarif ./..."

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always() && hashFiles('gosec-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Run npm audit
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high

      # gitleaks-action requires a paid licence for organization repos. Use the
      # MIT-licensed gitleaks CLI directly instead — same engine, same config.
      # Scans full history (the security job checks out with fetch-depth: 0).
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          # SHA-256 of gitleaks_8.30.0_linux_x64.tar.gz from the upstream
          # checksums.txt. Rotate this together with GITLEAKS_VERSION on upgrade.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Run Trivy vulnerability scanner
        # exit-code is 0 here so the SARIF always gets written; we still
        # surface findings as a separate step that fails CI when the SARIF
        # contains CRITICAL/HIGH entries.
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        # Reads the SARIF Trivy just produced and fails CI if any CRITICAL or
        # HIGH-severity result is present. We do this in a separate step so
        # the SARIF is always uploaded for security tab visibility.
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          if jq -e '.runs[].results[] | select(.level=="error" or .properties.security_severity == "high" or .properties.security_severity == "critical")' trivy-results.sarif >/dev/null; then
            echo "::error::Trivy found CRITICAL or HIGH severity issues — see Security tab."
            jq '.runs[].results[] | {ruleId, level, severity: .properties.security_severity, message: .message.text}' trivy-results.sarif
            exit 1
          fi

  # ===========================================================================
  # Semgrep SAST — required gate (Phase 4, replaces CodeQL as the required
  # SAST signal since CodeQL is skipped entirely on private repos)
  # ===========================================================================
  # Blocking on ERROR severity only for now — a deliberate first step,
  # mirroring seed #1737. WARNING/MEDIUM findings are visible in the job log
  # but do not fail the build yet; ratchet to a stricter --severity once the
  # current WARNING backlog is triaged in a follow-up. One known false
  # positive is already annotated inline with `// nosemgrep: <rule-id> --
  # <reason>` (mirroring the existing `#nosec` justifications) so the
  # ratchet won't need to re-litigate it: internal/auth/hibp.go (SHA-1 is
  # the HIBP k-anonymity API contract).
  #
  # Runs unconditionally (no path filter) — same rationale as `security`
  # above: SAST coverage on every PR is non-negotiable, and Semgrep is fast
  # enough (~1-2 min for this ruleset) that gating it behind path filters
  # isn't worth the added complexity.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [semgrep]. Edit the pinned version / config policy there.
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@3c9b3aadab847d2faab5116c6af07eb05d978d62 # v1.8.0
    permissions:
      contents: read
      # v1.8.0 publishes the all-severity SARIF to code scanning. The
      # upload is deliberately not continue-on-error, so this scope is
      # required, not optional.
      security-events: write

  # Asserts this repo's own gates are wired to gate: every job below is either
  # in ci-complete's needs or documented in .github/ci-advisory-jobs.txt, the
  # enabled linters meet the declared tier, and tool installs are pinned. Two
  # such gaps were found by hand on 2026-08-16; both arrived via a merge, which
  # is why this runs per PR rather than on a schedule.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [ci-conformance].
  ci-conformance:
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@3c9b3aadab847d2faab5116c6af07eb05d978d62 # v1.8.0
    permissions:
      contents: read

  # ============================================================================
  # Quality
  # ============================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    # Measured p95 ~6s (2026-08-15 runs); 3m gives comfortable headroom.
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for TODO/FIXME in critical paths
        run: |
          if grep -rn "TODO\|FIXME" --include="*.go" internal/ cmd/ 2>/dev/null | head -20; then
            echo "Note: TODOs found in Go code (info only)"
          fi

      - name: Check for unsafe logging patterns
        run: |
          echo "Checking for dangerous logging patterns..."
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
            'log\.Print.*secret'
            'fmt\.Printf.*password'
            'fmt\.Printf.*token'
          )
          VIOLATIONS=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rn -E "$pattern" --include="*.go" --exclude="*_test.go" internal/ cmd/ 2>/dev/null; then
              echo "❌ Found dangerous logging pattern: $pattern"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "ERROR: Found $VIOLATIONS unsafe logging pattern(s)"
            echo "Avoid logging sensitive data like passwords, tokens, or secrets"
            exit 1
          fi
          echo "✅ No unsafe logging patterns detected"

  # ============================================================================
  # Workflow Linting
  # ============================================================================
  # Static analysis of the workflows themselves. Kept out of `quality` so it
  # runs in parallel and only when workflow files actually change.
  #   actionlint — syntax, expression and shell errors inside run: blocks.
  #   zizmor     — Actions security scanner. Blocks on High findings only.
  #                The repo is at zero High; the one that survives review
  #                (release-please.yml) carries a `# zizmor: ignore[...]`
  #                comment with the reasoning inline.
  #                Low/Informational (~27) are reported but not yet enforced.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2129 is a pure style preference about grouping `>>` redirects in
          # step summaries; the ungrouped form stays readable and diffs one
          # line at a time. Every correctness-level rule stays enabled.
          actionlint -ignore 'SC2129' -color

      - name: Run zizmor
        env:
          # zizmor resolves action refs against the API; without a token it
          # falls back to unauthenticated requests and gets rate-limited.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install zizmor==1.29.0
          zizmor --min-severity high --color always .github/workflows/


  # ============================================================================
  # Internationalization (i18n) Validation
  # ============================================================================
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.ci_infra == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checks live once in MustardSeedNetworks/.github; this repo keeps
      # only its glossary, banned vocabulary, glossary exceptions and
      # dynamic-prefix allow-list. The action installs semgrep, self-tests the
      # key checker, then validates.
      #
      # Runs unflagged: --ratchet used to demote every fixed check to an
      # annotation, so the job went green while the tree carried 74 banned
      # fallback sites and a version assertion that was wrong in all three
      # repos. See scripts/i18n/README.md and
      # msn-docs-internal/05-Engineering/I18N_CONVENTIONS.md.
      - name: Validate i18n (parity, glossary, banned vocab, etc.)
        uses: MustardSeedNetworks/.github/.github/actions/i18n-validate@e6d74ebd42168c9b89f2b93f14841f58b90edece # v1.5.0
        with:
          # The action defaults to internal/i18n/locales, which is where these
          # lived while they sat inside a dead Go package. They belong to the
          # frontend and now live with it.
          locales-dir: ui/locales

  # ============================================================================
  # Documentation Checks
  # ============================================================================
  # Markdown lint + link check. Mirrors seed's docs job (#56). Both substeps
  # are advisory (continue-on-error) — they surface issues without blocking
  # the build, matching seed's stance that doc quality is a ratcheting goal.
  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # External link checking is NOT here: it walks every URL in every .md file,
    # measured ~6 min (the longest job in this workflow), and failed on
    # third-party link rot rather than on the change under review — which is
    # why it had been pinned to continue-on-error and enforced nothing.
    # It now runs on a schedule: .github/workflows/docs-link-check.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to diff against the base ref for changed-file scoping.
          fetch-depth: 0

      - name: Collect changed markdown files
        id: changed-md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD -- '*.md')
          else
            files=$(git ls-files '*.md')
          fi
          files=$(printf '%s\n' "${files}" | grep -vE '^(node_modules|build|dist|coverage)/' | grep -v 'CHANGELOG.md$' || true)
          {
            echo "files<<EOF"
            printf '%s\n' "${files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "${files}" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      # Blocking, but scoped to the files this change touches. The repo carries
      # ~490 pre-existing violations of its own .markdownlint.json; gating the
      # full tree would fail every PR, and gating nothing (the previous
      # continue-on-error) enforced nothing. Scoping ratchets the debt down as
      # files are touched, matching the file-size gate's baseline approach.
      - name: Lint changed markdown files
        if: steps.changed-md.outputs.empty != 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ steps.changed-md.outputs.files }}

  # ============================================================================
  # Build
  # ============================================================================
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [changes, build-ui, backend, frontend]
    runs-on: ${{ matrix.runner }}
    # Measured p95 ~50s (2026-08-15 runs); 8m gives comfortable headroom for
    # cold-cache Go setup + artifact download.
    timeout-minutes: 8
    # always() lets the if: evaluate when an upstream job was skipped —
    # without it the implicit success() on a job-level if: would skip this
    # job whenever any `needs` entry was skipped.
    #
    # The gate is build-ui, not frontend. These jobs consume the frontend-dist
    # artifact; the frontend job is the UI's *test* suite and produces nothing
    # they read. Requiring `frontend == 'success'` meant a backend-only PR —
    # where the path filter correctly skips frontend — skipped Build, the
    # Darwin compile check and E2E entirely, while CI Complete still went
    # green. Gating on the artifact's producer says what these jobs actually
    # need, and `frontend != failure` still blocks on a real UI test failure.
    # Note: matrix.required draft-skip was attempted here originally but
    # GitHub Actions rejects `matrix` in job-level if: (the matrix context
    # isn't bound until after the strategy expands). All matrix rows run
    # on every PR; per-arch arches are fast enough that the savings weren't
    # worth a workaround.
    #
    # macOS runners are 10x the minute multiplier of ubuntu-latest and are
    # NOT built here on PRs — darwin/amd64 (Intel) is dropped fleet-wide,
    # and darwin/arm64's real release binary is produced by goreleaser in
    # release.yml (unchanged). Since stem is CGO_ENABLED=0 (pure Go), the
    # darwin/arm64 build cross-compiles trivially on ubuntu; the dedicated
    # darwin-compile-check job below verifies it still compiles without
    # paying for a macOS runner on every PR.
    if: |
      always() &&
      needs.build-ui.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # UI build hash matches the Makefile recipe (md5 of all embedded UI files).
          # Mandatory per CLAUDE.md Universal Build Contract — /__version must
          # return a non-empty uiBuildHash to prove the UI was embedded.
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          echo "UI_BUILD_HASH=${UI_BUILD_HASH}"

          go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X github.com/MustardSeedNetworks/stem/internal/version.Version=${VERSION} \
              -X github.com/MustardSeedNetworks/stem/internal/version.Commit=${COMMIT} \
              -X github.com/MustardSeedNetworks/stem/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/MustardSeedNetworks/stem/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o bin/stem-${{ matrix.os }}-${{ matrix.arch }} \
            ./cmd/stem/

      # `|| true` made this catch nothing: a binary that will not execute, or
      # one whose /__version reports "unknown" because the ldflags were never
      # injected, both passed silently. That second case is exactly the
      # Universal Build Contract rule this step exists to enforce, so the
      # output is asserted rather than merely produced.
      - name: Verify binary
        if: matrix.os == 'linux' && matrix.arch == 'amd64' || matrix.os == 'darwin'
        run: |
          set -euo pipefail
          out=$(./bin/stem-${{ matrix.os }}-${{ matrix.arch }} version)
          echo "$out"
          if printf '%s' "$out" | grep -qi 'unknown'; then
            echo "::error::version output contains 'unknown' — build metadata was not injected"
            exit 1
          fi

      - name: Verify UIBuildHash embedded (Universal Build Contract)
        # Static check: binary must contain the md5 hash of the embedded
        # UI, proving the -X ...UIBuildHash=... ldflag was set in
        # `Build binary`. Failure means /__version would return
        # uiBuildHash="unknown" in prod — silent contract violation.
        # Only runs for native linux/amd64 + darwin (where `strings`
        # is available); cross-compiled arm64 binary uses identical
        # build command so it's covered by the amd64 check.
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          if [ -z "$(find internal/api/ui -mindepth 1 ! -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            echo "::error::internal/api/ui is empty — frontend-dist artifact missing?"
            exit 1
          fi
          EXPECTED=$(find internal/api/ui -type f -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          if [ "${#EXPECTED}" -ne 32 ]; then
            echo "::error::Computed UI_BUILD_HASH is not 32 chars: '$EXPECTED'"
            exit 1
          fi
          echo "Expected UIBuildHash: $EXPECTED"
          if strings ./bin/stem-${{ matrix.os }}-${{ matrix.arch }} | grep -qF "$EXPECTED"; then
            echo "  ✓ UIBuildHash embedded correctly"
          else
            echo "::error::Binary does not contain UIBuildHash $EXPECTED"
            echo "  → Universal Build Contract violated. Check -X ...UIBuildHash=... ldflag in 'Build binary' step."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stem-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/stem-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # ============================================================================
  # Darwin compile check — verifies the release target still cross-compiles
  # ============================================================================
  # macOS runners cost 10x the ubuntu-latest minute multiplier, so darwin
  # binaries are no longer built on PRs at all (see the `build` job comment
  # above). stem is CGO_ENABLED=0 (pure Go), so GOOS=darwin GOARCH=arm64
  # cross-compiles cleanly on ubuntu-latest — this job is a cheap compile-only
  # smoke check that the darwin/arm64 target hasn't broken, without paying for
  # a macOS runner. The actual signed darwin/arm64 release binary is still
  # produced by goreleaser in release.yml, unchanged. darwin/amd64 (Intel) is
  # dropped fleet-wide and is not checked here.
  darwin-compile-check:
    name: Darwin compile check (arm64)
    runs-on: ubuntu-latest
    # Measured p95 ~45s (2026-08-15 runs); 5m gives comfortable headroom.
    timeout-minutes: 5
    needs: [changes, build-ui, backend, frontend]
    if: |
      always() &&
      needs.build-ui.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Cross-compile for darwin/arm64 (no macOS runner needed)
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -trimpath -o /dev/null ./cmd/stem/

  # ============================================================================
  # E2E Browser Tests (Playwright)
  # ============================================================================
  e2e:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [changes, build-ui, backend, frontend]
    # NOT sized from p95. A job budget has to exceed its apt step's worst case
    # (10 min) plus the real work (~4m40s measured), or a slow mirror becomes
    # indistinguishable from a hung test. Sized to p95 the way this was, niac's
    # equivalent job died mid-Playwright and the merge queue ejected a release
    # PR for what looked like a test failure (niac-go#1350, run 32161326698) —
    # the mechanism behind #664.
    timeout-minutes: 25
    # Skipped on draft PRs (slow); also skipped if no frontend/backend changed.
    # always() lets the if: evaluate when an upstream job was skipped —
    # without it the implicit success() on a job-level if: would skip this
    # job whenever any `needs` entry was skipped.
    #
    # The gate is build-ui, not frontend. These jobs consume the frontend-dist
    # artifact; the frontend job is the UI's *test* suite and produces nothing
    # they read. Requiring `frontend == 'success'` meant a backend-only PR —
    # where the path filter correctly skips frontend — skipped Build, the
    # Darwin compile check and E2E entirely, while CI Complete still went
    # green. Gating on the artifact's producer says what these jobs actually
    # need, and `frontend != failure` still blocks on a real UI test failure.
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.build-ui.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Install frontend dependencies (for Playwright)
        working-directory: ui
        run: npm ci

      - name: Build backend
        run: CGO_ENABLED=0 go build -o bin/stem ./cmd/stem/

      # Restore always; save only from the default branch. Caches are scoped
      # per ref, so a PR that saves writes its own copy that dies on merge —
      # see the comment in .github/actions/setup-go for the incident.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright OS dependencies
        timeout-minutes: 10
        # apt packages only, not cacheable — always runs regardless of whether
        # the browser binaries above were restored from cache. Not removable:
        # the runner image ships none of webkit's GStreamer/font stack (181
        # packages, 114 MB on a clean run).
        #
        # A stalled Ubuntu mirror once hung apt for 28 minutes and ate the
        # whole job budget without running a test (job 95068053052), because
        # apt waits forever on a dead connection by default. Bound apt's own
        # network waits, then retry the transient case.
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        with:
          command: cd ui && npx playwright install-deps

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ui
        # Per E2E_CONVENTIONS: chromium (Chrome+Edge) and webkit (Safari).
        # --with-deps omitted — OS deps are installed unconditionally above.
        run: npx playwright install chromium webkit

      - name: Save Playwright browsers (default branch only)
        if: steps.playwright-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}

      - name: Start backend server
        env:
          STEM_AUTH_USERNAME: admin
          STEM_AUTH_PASSWORD: admin
          # The whole Playwright suite drives this one backend from one runner
          # IP, fullyParallel across chromium and webkit. The per-IP API bucket
          # is 100/min shared by every spec at once, and it ran dry in
          # merge_group run 32174274597: settings-drawer-module.spec.ts failed
          # on BOTH browsers and rfc2544-journey.spec.ts on chromium, with the
          # DOM rendering "Could not load the test modules from this stem
          # (HTTP 429)" — a real 429 from a real limiter, not a locator bug.
          #
          # Raised, not disabled: the override cannot go below the compiled-in
          # default, so this stays a bounded limiter and the suite still proves
          # the middleware is wired. Same shape as seed's
          # SEED_LOGIN_MAX_ATTEMPTS=200 in scripts/run-e2e.sh.
          STEM_API_RATE_LIMIT: "5000"
        run: |
          # Backend is HTTPS-by-default since the Wave 1 TLS rollout. The
          # legacy STEM_TLS_ENABLED env var was removed from the code; self-
          # signed cert is auto-generated on first start. Use -k on curl
          # probes; Playwright bypasses cert via PLAYWRIGHT_IGNORE_HTTPS_ERRORS.
          nohup ./bin/stem web -p 8444 > server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -skf https://localhost:8444/health/ready 2>/dev/null; then
              echo "Server ready after $i attempts"
              exit 0
            fi
            echo "Attempt $i: Server not ready, waiting..."
            sleep $((i < 5 ? 1 : 2))
          done
          echo "Server failed to start after 30 attempts"
          cat server.log
          exit 1

      - name: Run Playwright E2E tests
        working-directory: ui
        env:
          E2E_BASE_URL: https://localhost:8444
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "true"
        # Both chromium and webkit run; the config's projects array is now
        # exactly [chromium, webkit] per E2E_CONVENTIONS.
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-server-logs
          path: server.log

  # ============================================================================
  # CI Complete — dispatcher / branch-protection aggregator
  # ============================================================================
  # Every required-status-check on `main` is consolidated into this single
  # job. It fails if any upstream job actually failed; it passes if every
  # upstream either succeeded or was intentionally skipped via the path
  # filter. Branch protection requires ONLY "CI Complete" (plus "Lint PR
  # Title" / "Lint PR Body" from their own workflows) rather than
  # enumerating every individual job — so a docs-only PR can merge cleanly
  # when backend/frontend/c are all skipped. CodeQL and license-check are
  # NOT required contexts: CodeQL is advisory (and skips entirely on
  # private repos) and license-check reports without blocking. The
  # `semgrep` job in this file is the required SAST gate (blocking on
  # ERROR severity).
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NOTE: e2e now gates, matching niac-go. It was advisory because browser
    # downloads were a flaky external dependency — that was fixed by the
    # bounded apt-install retry, so the original reason no longer holds and an
    # ungated 200s job was the worst of both worlds.
    # They were dropped from required-status-checks on main because they're
    # advisory (flaky / surface real issues that are tracked separately).
    # Including them here would re-block merge via the dispatcher on the
    # same flakes. They still run on every PR and surface their own status;
    # they just don't gate merge.
    needs:
      - changes
      - build-ui
      - backend
      - race
      - frontend
      - storybook
      - c-lint
      - dataplane-safety
      - security
      - semgrep
      - ci-conformance
      - quality
      - workflow-lint
      - i18n
      - docs
      - build
      - darwin-compile-check
      - e2e
    if: always()
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
