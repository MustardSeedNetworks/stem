name: 'APT Install (bounded, retried)'
description: >
  Installs apt packages with bounded network timeouts and a 3-attempt retry
  that recovers from a half-configured dpkg state. A stalled Ubuntu mirror
  once hung apt for 25 minutes installing a single package elsewhere in the
  fleet (niac job 95072124340), because apt waits forever on a dead
  connection by default — this bounds apt's own network waits, then retries
  the transient case.
inputs:
  packages:
    description: 'Space-separated list of apt packages to install. Ignored if `command` is set.'
    required: false
    default: ''
  command:
    description: >
      Full command to retry instead of `apt-get update && apt-get install -y
      <packages>` (e.g. `npx playwright install-deps`, which drives apt
      itself). The apt timeout conf is still written first.
    required: false
    default: ''
  no-install-recommends:
    description: 'Pass --no-install-recommends to apt-get install.'
    required: false
    default: 'false'
  sudo:
    description: >
      Prefix apt/dpkg commands with sudo. Set to false when already running
      as root, e.g. inside the goreleaser-cross release container.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install packages (bounded, retried)
      shell: bash
      env:
        APT_INSTALL_PACKAGES: ${{ inputs.packages }}
        APT_INSTALL_COMMAND: ${{ inputs.command }}
        APT_INSTALL_NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
        APT_INSTALL_SUDO: ${{ inputs.sudo }}
      run: |
        sudo_cmd=()
        if [ "${APT_INSTALL_SUDO}" = "true" ]; then
          sudo_cmd=(sudo)
        fi

        "${sudo_cmd[@]}" tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        Acquire::Retries "2";
        DPkg::Lock::Timeout "60";
        EOF

        install_flags=()
        if [ "${APT_INSTALL_NO_RECOMMENDS}" = "true" ]; then
          install_flags=(--no-install-recommends)
        fi
        read -r -a packages <<< "${APT_INSTALL_PACKAGES}"

        for attempt in 1 2 3; do
          # A timeout kill can leave dpkg half-configured; recover first.
          if [ "$attempt" -gt 1 ]; then
            "${sudo_cmd[@]}" dpkg --configure -a >/dev/null 2>&1 || true
          fi
          if [ -n "${APT_INSTALL_COMMAND}" ]; then
            if timeout -k 15 120 bash -c "${APT_INSTALL_COMMAND}"; then
              exit 0
            fi
          else
            if timeout -k 15 120 "${sudo_cmd[@]}" apt-get update && \
               timeout -k 15 120 "${sudo_cmd[@]}" apt-get install -y "${install_flags[@]}" "${packages[@]}"; then
              exit 0
            fi
          fi
          echo "install attempt ${attempt} failed; retrying in $((attempt * 10))s..."
          sleep $((attempt * 10))
        done
        echo "::error::install failed after 3 attempts"
        exit 1
