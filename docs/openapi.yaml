components:
    schemas:
        Error:
            properties:
                code:
                    type: string
                error:
                    type: string
                message:
                    type: string
            required:
                - error
                - code
                - message
            type: object
    securitySchemes:
        BearerAuth:
            description: |
                Access token from POST /api/v1/auth/login, sent as the stem_access cookie or an Authorization bearer.
            scheme: bearer
            type: http
        CsrfToken:
            description: Per-session CSRF token from GET /api/v1/auth/csrf-token.
            in: header
            name: X-Csrf-Token
            type: apiKey
info:
    contact:
        name: Mustard Seed Networks
        url: https://github.com/MustardSeedNetworks/stem
    description: |
        REST API of the Stem daemon: RFC 2544, Y.1564, Y.1731, RFC 2889,
        RFC 6349, MEF and TSN test execution, the reflector, licensing and
        first-run setup. The web UI and the `stem` CLI are both clients of it.

        ## Authentication
        Operations with the `BearerAuth` requirement need the access token that
        `POST /api/v1/auth/login` returns. The browser presents it as the
        `stem_access` cookie; API clients and the CLI send it as
        `Authorization: Bearer`. `/__version`, `/__capabilities` and the health
        probes are deliberately unauthenticated deployment introspection.

        ## CSRF protection
        Operations marked with the `CsrfToken` security scheme need a token from
        `GET /api/v1/auth/csrf-token` in the `X-Csrf-Token` header. Tokens are
        per session, keyed by the access token that fetched them. A request that
        carries no session at all is not checked for CSRF.

        ## Rate limiting
        Routes marked rate limited answer 429 once their per-IP budget is spent.
        Credential and MFA endpoints share a strict budget; the rest share a
        general one.
